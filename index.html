// Query / Abfrage
// ============================================================
function cmpQuery(val, op, target) {
  if (op === "=") return val === target;
  if (op === "<=") return val <= target;
  if (op === ">=") return val >= target;
  return false;
}

// Per-round "Asse" (count of holes with score === 1)
function roundAces(round) {
  return round.scores.filter(s => s === 1).length;
}
// Per-round "Fehler" (sum of strokes over par, across all holes)
function roundErrors(round) {
  return round.scores.reduce((sum, s, i) => sum + (s > PARS[i] ? (s - PARS[i]) : 0), 0);
}

// Period encoding: "all" | "YYYY" | "YYYY-MM" | "*-MM" (a specific month across all years)
const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function parsePeriod(period) {
  if (!period || period === "all") return { year: "all", month: "all" };
  const m = period.match(/^(\d{4}|\*)-(\d{2})$/);
  if (m) return { year: m[1] === "*" ? "all" : m[1], month: m[2] };
  if (/^\d{4}$/.test(period)) return { year: period, month: "all" };
  return { year: "all", month: "all" };
}

function buildPeriod(year, month) {
  if (year === "all" && month === "all") return "all";
  if (year !== "all" && month === "all") return year;
  if (year === "all" && month !== "all") return `*-${month}`;
  return `${year}-${month}`;
}

function periodLabel(period) {
  const { year, month } = parsePeriod(period);
  if (year === "all" && month === "all") return "Alle Jahre";
  if (year !== "all" && month === "all") return year;
  const monthName = MONTH_NAMES[parseInt(month,10)-1] || month;
  if (year === "all") return `${monthName} (alle Jahre)`;
  return `${monthName} ${year}`;
}

function roundMatchesPeriod(round, period) {
  if (period === "all") return true;
  const date = round.date || "";
  const { year, month } = parsePeriod(period);
  const rYear = round.year || date.slice(0,4);
  const rMonth = date.slice(5,7);
  if (year !== "all" && rYear !== year) return false;
  if (month !== "all" && rMonth !== month) return false;
  return true;
}

function evaluateForPeriod(player, q, period) {
  const rounds = player.rounds.filter(r => roundMatchesPeriod(r, period));
  const total = rounds.length;

  let matched;
  if (q.mode === "total") {
    matched = rounds.filter(r => cmpQuery(r.scores.reduce((a,b)=>a+b,0), q.operator, q.value));
  } else if (q.mode === "aces") {
    matched = rounds.filter(r => cmpQuery(roundAces(r), q.operator, q.value));
  } else if (q.mode === "errors") {
    matched = rounds.filter(r => cmpQuery(roundErrors(r), q.operator, q.value));
  } else {
    const holeIdxs = q.allHoles ? HOLES.map((_,i)=>i) : q.holes;
    matched = holeIdxs.length === 0 ? [] : rounds.filter(r => holeIdxs.some(idx => cmpQuery(r.scores[idx], q.operator, q.value)));
  }

  matched = [...matched].sort((a,b) => a.date < b.date ? 1 : -1);
  return { total, matches: matched.length, matchedRounds: matched };
}


function evaluateQuery(player) {
  const q = state.query;
  state.query.result = evaluateForPeriod(player, q, q.period);
  state.query.resultB = q.compareEnabled ? evaluateForPeriod(player, q, q.periodB) : null;
}

function renderPeriodSelectors(year, month, years, action) {
  return `<div style="display:flex; gap:0.5rem;">

      <option value="all" ${year === "all" ? "selected" : ""}>Alle Jahre</option>
      ${years.map(y => `<option value="${esc(y)}" ${year === y ? "selected" : ""}>${esc(y)}</option>`).join("")}
    </select>
    <select class="sel" data-action="${action}-month" style="flex:1; background:white; color:var(--ink); border:1px solid #d6d3d1;">
      <option value="all" ${month === "all" ? "selected" : ""}>Alle Monate</option>
      ${MONTH_NAMES.map((name, idx) => {
        const mm = String(idx+1).padStart(2,"0");
        return `<option value="${mm}" ${month === mm ? "selected" : ""}>${name}</option>`;
      }).join("")}
    </select>
  </div>`;
}

  html += `</div>`;
  return html;
}

// Finds all rounds on the given date that have NO groupId yet (i.e. were never
// linked to a shared round), across all players.
function getMergeRoundCandidates(exactDate, prefix, playerIds) {
  const results = [];
  state.players.forEach(player => {
    if (playerIds && playerIds.length > 0 && !playerIds.includes(player.id)) return;
    player.rounds.forEach(round => {
      if (exactDate && round.date !== exactDate) return;
      if (!exactDate && prefix && !(round.date && round.date.startsWith(prefix))) return;
      if (!round.groupId) results.push({ player, round });
    });
  });
  results.sort((a, b) => {
    const d = b.round.date.localeCompare(a.round.date);
    if (d !== 0) return d;
    return (b.round.time || "").localeCompare(a.round.time || "");
  });
  return results;
}

function getUngroupedRoundsForDate(dateStr) {
  return getMergeRoundCandidates(dateStr, null, []);
}

    <button class="collapsible-head" data-action="toggle-merge-section">

      <span class="collapsible-arrow ${state.collapsed.merge ? 'collapsed' : ''}">${ICONS.chevron(16)}</span>
    </button>`;

  if (!state.collapsed.merge) {
    html += `<div class="collapsible-body">
      <p style="font-size:0.8rem; color:#78716c; margin:0 0 0.75rem;">Wähle Jahr, Monat und/oder Tag – und beliebig viele Spieler.</p>`;

    const allYears = [...new Set(state.players.flatMap(p => p.rounds.map(r => r.date && r.date.slice(0,4))))].filter(Boolean).sort().reverse();
    const allMonths = mf.year
      ? [...new Set(state.players.flatMap(p => p.rounds.filter(r => r.date && r.date.startsWith(mf.year)).map(r => r.date.slice(5,7))))].filter(Boolean).sort()
      : [];
    const allDays = mf.year && mf.month
      ? [...new Set(state.players.flatMap(p => p.rounds.filter(r => r.date && r.date.startsWith(mf.year + "-" + mf.month)).map(r => r.date.slice(8,10))))].filter(Boolean).sort()
      : [];

    const monthNames = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

    html += `<div style="display:flex; gap:0.4rem; margin-bottom:0.75rem;">
      <div style="flex:1;">
        <label class="field-label">Jahr</label>
        <select id="mf-year" style="width:100%;">
          <option value="">–</option>
          ${allYears.map(y => `<option value="${y}" ${mf.year === y ? 'selected' : ''}>${y}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1;">
        <label class="field-label">Monat</label>
        <select id="mf-month" style="width:100%;" ${!mf.year ? 'disabled' : ''}>
          <option value="">–</option>
          ${allMonths.map(m => `<option value="${m}" ${mf.month === m ? 'selected' : ''}>${monthNames[parseInt(m)-1]}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1;">
        <label class="field-label">Tag</label>
        <select id="mf-day" style="width:100%;" ${!mf.month ? 'disabled' : ''}>
          <option value="">–</option>
          ${allDays.map(d => `<option value="${d}" ${mf.day === d ? 'selected' : ''}>${parseInt(d)}.</option>`).join('')}
        </select>
      </div>
    </div>`;

    html += `<label class="field-label" style="margin-bottom:0.4rem;">Spieler (optional)</label>
    <div style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.75rem;">
      ${state.players.map(p => `<button class="chip ${mf.playerIds.includes(p.id) ? 'selected' : ''}" data-action="merge-filter-toggle-player" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('')}
    </div>`;

    const hasFilter = mf.year || mf.playerIds.length > 0;
    if (hasFilter) {
      const filterDate = mf.year && mf.month && mf.day ? `${mf.year}-${mf.month}-${mf.day}` : null;
      const filterPrefix = mf.year && mf.month ? mf.year + "-" + mf.month : mf.year ? mf.year : null;
      const candidates = getMergeRoundCandidates(filterDate, filterPrefix, mf.playerIds);
      if (candidates.length === 0) {
        html += `<p style="font-size:0.85rem; color:#a8a29e; margin:0;">Keine einzeln eingetragenen Runden gefunden.</p>`;
      } else {
        html += `<label class="field-label" style="margin-bottom:0.4rem;">${candidates.length} Runde${candidates.length !== 1 ? 'n' : ''} gefunden</label>`;
        candidates.forEach(({ player, round }) => {
          const key = player.id + "::" + round.id;
          const checked = state.mergeSelectedIds.includes(key);
          const total = round.scores.reduce((a,b) => a+b, 0);
          html += `<label style="display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0; border-bottom:1px solid #f5f5f4; cursor:pointer;">
            <input type="checkbox" data-action="toggle-merge-round" data-key="${esc(key)}" ${checked ? 'checked' : ''} style="width:1.1rem; height:1.1rem;" />
            <span style="flex:1;">
              <span style="font-weight:500;">${esc(player.name)}</span>
              <span style="color:#a8a29e; font-size:0.78rem;"> · ${round.date}${round.time ? ' ' + round.time : ''}</span>
            </span>
            <span class="font-mono" style="font-weight:600;">${total}</span>
          </label>`;
        });
        const selectedCount = state.mergeSelectedIds.filter(key => candidates.some(c => (c.player.id+"::"+c.round.id) === key)).length;
        html += `<button class="btn btn-primary btn-full" style="margin-top:0.75rem;" data-action="merge-rounds" ${selectedCount < 2 ? 'disabled' : ''}>${ICONS.users(15)} Ausgewählte zusammenführen${selectedCount >= 2 ? ' (' + selectedCount + ')' : ''}</button>
        <p style="font-size:0.75rem; color:#a8a29e; margin:0.5rem 0 0;">Mindestens 2 Runden auswählen.</p>`;
      }
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

  // --- Pricing per year ---

function renderCostsView() {
  const years = getAllYears();
  const year = state.costsYear || years[0] || String(new Date().getFullYear());
  const yearNum = parseInt(year, 10);

  let html = `<h2 class="section-title">${ICONS.bar(18, "#2D6A4F")} Kosten-Übersicht</h2>

  <select class="sel" data-action="costs-select-year" style="width:100%; margin-bottom:1rem; background:white; color:var(--ink); border:1px solid #d6d3d1;">
    ${years.map(y => `<option value="${esc(y)}" ${year === y ? "selected" : ""}>${esc(y)}</option>`).join("")}
  </select>`;

  // --- 1. Saison ---
  const christian = state.players.find(p => p.name === "Christian");
  let roundsForYear = [];
  if (christian && yearNum >= 2016) {
    roundsForYear = christian.rounds.filter(r => (r.year || (r.date||"").slice(0,4)) === year);
    html += renderSeasonCard(roundsForYear, year);
  } else if (!christian) {
    html += `<div class="card-dashed">Kein Spieler "Christian" gefunden – die Kosten-Berechnung gilt nur für diesen Spieler.</div>`;
  } else {
    html += `<div class="card-dashed">Die Kosten-Berechnung gilt erst ab Saison 2016.</div>`;
  }

  // --- 2. Kostenaufstellung (gesamt) ---
  const seasonData = christian ? computeSeasonData(roundsForYear, year) : null;
  const birgit = state.players.find(p => p.name === "Birgit");
  const birgitRoundsForYear = birgit ? birgit.rounds.filter(r => (r.year || (r.date||"").slice(0,4)) === year) : [];
  const includeBirgit = state.includeBirgitCosts !== false;
  const birgitSeasonData = (includeBirgit && birgitRoundsForYear.length > 0) ? computeTagestarifCost(birgitRoundsForYear, year) : null;
  const yearAccessories = state.accessories.filter(a => a.year === year);
  const accessoriesTotal = yearAccessories.reduce((sum,a) => sum + (parseDecimal(a.amount)||0), 0);
  const yearGastro = state.gastro.filter(g => g.year === year);
  const gastroTotal = yearGastro.reduce((sum,g) => sum + (parseDecimal(g.amount)||0), 0);

  html += `<div class="collapsible-card">
    <button class="collapsible-head" data-action="toggle-cost-summary">
      <h3>Kostenaufstellung ${yearNum}</h3>
      <span class="collapsible-arrow ${!state.showCostSummary ? 'collapsed' : ''}">${ICONS.chevron(16)}</span>
    </button>`;

  if (state.showCostSummary) {
    html += `<div class="collapsible-body">`;
    if (birgit && birgit.rounds.some(r => (r.year || (r.date||"").slice(0,4)) === year)) {
      html += `<label style="display:flex; align-items:center; gap:0.5rem; padding:0.3rem 0 0.7rem; font-size:0.85rem; color:#57534e;">
        <input type="checkbox" data-action="toggle-include-birgit" ${includeBirgit ? "checked" : ""} />
        Birgits Kosten mit einrechnen
      </label>`;
    }
    if (seasonData) {
      if (seasonData.prices.hasSeasonPass) {
        html += `<div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #f5f5f4;">
          <span>Jahreskarte</span><span class="font-mono" style="font-weight:600;">${seasonData.prices.seasonPass.toFixed(2).replace('.',',')} €</span>
        </div>`;
        if (seasonData.weekendHolidayCost > 0) {
          html += `<div style="display:flex; align-items:center; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #f5f5f4;">
            <div>
              <div>Wochenende/Feiertage (zusätzlich)</div>
              <div style="font-size:0.75rem; color:#a8a29e;">${seasonData.weekendHolidayFirstCount} Erst-Runde${seasonData.weekendHolidayFirstCount!==1?'n':''}, ${seasonData.weekendHolidayExtraCount} Wiederholungsrunde${seasonData.weekendHolidayExtraCount!==1?'n':''}</div>
            </div>
            <span class="font-mono" style="font-weight:600;">${seasonData.weekendHolidayCost.toFixed(2).replace('.',',')} €</span>

          <span>Rundenkosten (Tagestarif, aktuell)</span><span class="font-mono" style="font-weight:600;">${seasonData.wouldCost.toFixed(2).replace('.',',')} €</span>
        </div>`;
      }
    }
    if (birgitSeasonData) {
      html += `<div style="display:flex; align-items:center; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #f5f5f4;">
        <div>
          <div>Birgit – Rundenkosten (Tagestarif)</div>
          <div style="font-size:0.75rem; color:#a8a29e;">${birgitSeasonData.spielwertFirstCount} Erst-Runde${birgitSeasonData.spielwertFirstCount!==1?'n':''}, ${birgitSeasonData.spielwertExtraCount} Wiederholungsrunde${birgitSeasonData.spielwertExtraCount!==1?'n':''}</div>
        </div>
        <span class="font-mono" style="font-weight:600;">${birgitSeasonData.wouldCost.toFixed(2).replace('.',',')} €</span>
      </div>`;
    }
    if (yearAccessories.length > 0) {
      yearAccessories.sort((a,b)=>a.date<b.date?1:-1).forEach(a => {
        html += `<div style="display:flex; align-items:center; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #f5f5f4;">
          <div>
            <div style="font-weight:500;">${esc(a.name)}</div>
            <div style="font-size:0.75rem; color:#a8a29e;">${formatDate(a.date)}</div>
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <div class="font-mono" style="font-weight:600;">${parseDecimal(a.amount).toFixed(2).replace('.',',')} €</div>
            <button class="icon-btn icon-btn-danger" style="width:1.75rem;height:1.75rem;" data-action="delete-accessory" data-id="${esc(a.id)}">${ICONS.trash(15)}</button>
          </div>
        </div>`;
      });
    } else {
      html += `<p style="font-size:0.85rem; color:#a8a29e; margin:0.5rem 0;">Noch keine Zubehör-Käufe für ${yearNum}.</p>`;
    }

    if (yearGastro.length > 0) {
      // Group by month
      const byMonth = {};
      yearGastro.forEach(g => {
        const month = (g.date || "").slice(0, 7); // YYYY-MM
        if (!byMonth[month]) byMonth[month] = [];
        byMonth[month].push(g);
      });
      const monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
      Object.keys(byMonth).sort().reverse().forEach(month => {
        const entries = byMonth[month];
        const monthTotal = entries.reduce((sum, g) => sum + (parseDecimal(g.amount) || 0), 0);
        const [mYear, mMon] = month.split('-');
        const monthLabel = `${monthNames[parseInt(mMon,10)-1]} ${mYear}`;
        const expandKey = `gastro-month-${month}`;
        const isExpanded = state.collapsed[expandKey] === false;
        html += `<div style="padding:0.4rem 0; border-bottom:1px solid #f5f5f4;">
          <div style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;" data-action="toggle-gastro-month" data-month="${esc(month)}">
            <div style="font-weight:600; font-size:0.88rem;">🍴 ${esc(monthLabel)}</div>
            <div style="display:flex; align-items:center; gap:0.5rem;">
              <div class="font-mono" style="font-weight:700;">${monthTotal.toFixed(2).replace('.',',')} €</div>
              <span style="color:#a8a29e; font-size:0.75rem;">${isExpanded ? '▲' : '▼'}</span>
            </div>
          </div>
          ${isExpanded ? entries.map(g => `<div style="display:flex; align-items:center; justify-content:space-between; padding:0.3rem 0 0.3rem 0.75rem; border-top:1px solid #f5f5f4; margin-top:0.25rem;">
            <div>
              <div style="font-size:0.82rem; font-weight:500;">${esc(g.name || "Gastronomie")}</div>
              <div style="font-size:0.72rem; color:#a8a29e;">${formatDate(g.date)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:0.5rem;">
              <div class="font-mono" style="font-size:0.85rem; font-weight:600;">${parseDecimal(g.amount).toFixed(2).replace('.',',')} €</div>
              <button class="icon-btn icon-btn-danger" style="width:1.75rem;height:1.75rem;" data-action="delete-gastro" data-id="${esc(g.id)}">${ICONS.trash(15)}</button>
            </div>
          </div>`).join('') : ''}
        </div>`;
      });
    }

    const grandTotal = (seasonData
      ? (seasonData.prices.hasSeasonPass
          ? seasonData.prices.seasonPass + (seasonData.prices.seasonPassAll ? 0 : seasonData.weekendHolidayCost)
          : seasonData.wouldCost)
      : 0) + (birgitSeasonData ? birgitSeasonData.wouldCost : 0) + accessoriesTotal + gastroTotal;
    html += `<div style="display:flex; justify-content:space-between; padding-top:0.6rem; margin-top:0.4rem; border-top:2px solid #e7e5e4;">
      <span style="font-weight:700;">Gesamt</span><span class="font-mono" style="font-weight:700; font-size:1.1rem;">${grandTotal.toFixed(2).replace('.',',')} €</span>
    </div>`;
    html += `</div>`;
  }
  html += `</div>`;

  // --- 3. Zubehör-Kauf erfassen (input only) ---
  html += `<div class="collapsible-card">
    <button class="collapsible-head" data-action="toggle-accessory-form">
      <h3>Zubehör-Kauf erfassen</h3>
      <span class="collapsible-arrow ${state.collapsed.accessoryForm ? 'collapsed' : ''}">${ICONS.chevron(16)}</span>
    </button>`;
  if (!state.collapsed.accessoryForm) {
    html += `<div class="collapsible-body">
      <label class="field-label">Bezeichnung</label>
      <input type="text" id="accessory-name" placeholder="z.B. neuer Schläger" style="margin-bottom:0.5rem;" />
      <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
        <input type="date" id="accessory-date" value="${yearNum===new Date().getFullYear() ? todayISO() : year+'-01-01'}" style="flex:1;" />
        <input type="text" inputMode="decimal" id="accessory-amount" placeholder="€" style="width:5rem;" />
      </div>
      <button class="btn btn-primary btn-full" data-action="add-accessory" data-year="${esc(year)}">${ICONS.plus(15)} Hinzufügen</button>
    </div>`;
  }
  html += `</div>`;

  // --- 3b. Gastronomie erfassen (input only) ---
  html += `<div class="collapsible-card">
    <button class="collapsible-head" data-action="toggle-gastro-form">
      <h3>🍴 Gastronomie erfassen</h3>
      <span class="collapsible-arrow ${state.collapsed.gastroForm ? 'collapsed' : ''}">${ICONS.chevron(16)}</span>
    </button>`;
  if (!state.collapsed.gastroForm) {
    html += `<div class="collapsible-body">
      <input type="date" id="gastro-date" value="${todayISO()}" style="margin-bottom:0.75rem;" />
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:0.5rem;">
        <div><label class="field-label">🥤 Getränke (€)</label><input type="text" inputMode="decimal" id="gastro-drinks" placeholder="0,00" /></div>

      </div>
      <div style="margin-bottom:0.5rem;"><label class="field-label">🍦 Eis (€)</label><input type="text" inputMode="decimal" id="gastro-icecream" placeholder="0,00" /></div>

      <button class="btn btn-primary btn-full" data-action="add-gastro" data-year="${esc(year)}">${ICONS.plus(15)} Hinzufügen</button>
    </div>`;
  }
  html += `</div>`;

  // --- 4. Wochenenden & Feiertage ---
  const holidays = germanHolidays(yearNum);
  const seasonStart = new Date(yearNum, 2, 1);
  const seasonEnd = new Date(yearNum, 9, 31);
  let weekendDays = 0;
  const cur = new Date(seasonStart);
  while (cur <= seasonEnd) {
    const dow = cur.getDay();
    if (dow === 0 || dow === 6) weekendDays++;
    cur.setDate(cur.getDate()+1);
  }

  html += `<div class="collapsible-card">
    <button class="collapsible-head" data-action="toggle-holidays-card">
      <h3>Wochenenden &amp; Feiertage ${yearNum}</h3>
      <span class="collapsible-arrow ${state.collapsed.holidays ? 'collapsed' : ''}">${ICONS.chevron(16)}</span>
    </button>`;
  if (!state.collapsed.holidays) {
    html += `<div class="collapsible-body">
      <p style="font-size:0.8rem; color:#78716c; margin:0 0 0.75rem;">Zeitraum 01.03.–31.10.</p>
      <div class="stat-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:0.75rem;">

  }
  html += `</div>`;

  return html;
}

function renderStatsView(player, rounds) {
  const n = rounds.length;
  if (n === 0) {
    return `<h2 class="section-title">${ICONS.bar(18, "#2D6A4F")} Statistik von ${esc(player.name)}</h2>
    <div class="card-dashed">Noch keine Daten für Statistiken. Trage zuerst ein paar Runden ein.</div>`;
  }

  const totals = rounds.map(r => r.scores.reduce((a,b)=>a+b,0));
  const best = Math.min(...totals);
  const avg = totals.reduce((a,b)=>a+b,0) / n;
  const totalAces = rounds.reduce((s,r) => s + r.scores.filter(v=>v===1).length, 0);
  const totalStrokes = totals.reduce((a,b)=>a+b,0);
  const cleanRounds = rounds.filter(r => r.scores.every((s,i) => s <= PARS[i])).length;
  let longestAceStreak = 0;
  rounds.forEach(r => {
    let streak = 0;
    r.scores.forEach(s => {
      if (s === 1) { streak++; if (streak > longestAceStreak) longestAceStreak = streak; }
      else streak = 0;
    });
  });

  const holeStats = HOLES.map((hole, idx) => {
    const vals = rounds.map(r => r.scores[idx]);
    const holeAvg = vals.reduce((a,b)=>a+b,0) / vals.length;
    const holeAces = vals.filter(v=>v===1).length;
    const aceRate = vals.length > 0 ? (holeAces / vals.length) * 100 : 0;
    return { hole, par: PARS[idx], avg: holeAvg, aces: holeAces, aceRate };
  });
  // Rank holes by average score (1 = best/lowest average, 18 = worst/highest average)
  [...holeStats].sort((a,b) => a.avg - b.avg).forEach((h, i) => { h.rank = i + 1; });

  const allScores = rounds.flatMap(r => r.scores);
  const dist = [1,2,3,4,5].map(val => ({
    val, label: val === 5 ? "5+" : String(val),
    count: allScores.filter(s => val === 5 ? s >= 5 : s === val).length,
  }));
  const maxDist = Math.max(...dist.map(d=>d.count), 1);

  const sorted = [...rounds].sort((a,b) => a.date > b.date ? 1 : -1);

  let html = `<h2 class="section-title">${ICONS.bar(18, "#2D6A4F")} Statistik von ${esc(player.name)}</h2>`;

  html += `<div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Runden</div><div class="stat-value font-mono">${n}</div></div>
    <div class="stat-card" data-action="show-stats-list" data-type="best" style="cursor:pointer;"><div class="stat-label">Bestes Ergebnis</div><div class="stat-value font-mono">${best}</div><div class="stat-sub">${best-PAR_TOTAL>=0?'+':''}${best-PAR_TOTAL} zu Par · Top 10 ansehen</div></div>
    <div class="stat-card"><div class="stat-label">Schnitt</div><div class="stat-value font-mono">${avg.toFixed(1)}</div><div class="stat-sub">Par ${PAR_TOTAL}</div></div>
    <div class="stat-card accent"><div class="stat-label">Asse insgesamt</div><div class="stat-value font-mono">${totalAces}</div></div>
    <div class="stat-card accent" data-action="show-stats-list" data-type="aces" style="cursor:pointer;"><div class="stat-label">Asse in Folge</div><div class="stat-value font-mono">${longestAceStreak}</div><div class="stat-sub">Rekord · Top 10 ansehen</div></div>
    <div class="stat-card" data-action="show-stats-list" data-type="clean" style="cursor:pointer;"><div class="stat-label">Fehlerfreie Runden</div><div class="stat-value font-mono">${cleanRounds}</div><div class="stat-sub">${n>0 ? (cleanRounds/n*100).toFixed(1).replace('.',',') : '0'} % · alle ansehen</div></div>
  </div>`;

  html += `<div class="card" style="font-size:0.875rem; color:#57534e;">Insgesamt <strong style="color:#292524;">${totalStrokes}</strong> Schläge in <strong style="color:#292524;">${n}</strong> Runden gespielt.</div>`;

  const worstHoles = [...holeStats].sort((a,b) => b.avg - a.avg).slice(0, 5);
  html += `<div class="card">
    <h3 style="font-size:0.875rem; font-weight:600; color:#44403c; margin:0 0 0.3rem;">⚠️ Problem-Bahnen</h3>
    <p style="font-size:0.75rem; color:#a8a29e; margin:0 0 0.7rem;">Die Bahnen mit dem höchsten Schnitt in dieser Auswahl.</p>`;
  worstHoles.forEach((h, i) => {
    const diff = h.avg - h.par;
    html += `<div style="display:flex; align-items:center; gap:0.6rem; padding:0.4rem 0; ${i < worstHoles.length-1 ? 'border-bottom:1px solid #f5f5f4;' : ''}">
      <span style="font-weight:700; color:#a8a29e; font-size:0.8rem; width:1.3rem; flex-shrink:0;">${i+1}.</span>
      <span style="flex:1; font-size:0.88rem;">Bahn ${h.hole} <span style="color:#a8a29e; font-size:0.78rem;">(Par ${h.par})</span></span>
      <span class="font-mono" style="font-weight:700; color:#dc2626; font-size:0.92rem;">${h.avg.toFixed(2)}</span>
      <span style="font-size:0.74rem; color:#a8a29e; width:3.2rem; text-align:right; flex-shrink:0;">${diff>=0?'+':''}${diff.toFixed(1)} Par</span>
    </div>`;
  });
  html += `</div>`;

  if (SEASON_PLAYER_NAMES.includes(player.name) && state.activeYear !== "all" && parseInt(state.activeYear,10) >= 2022) {
    html += renderSeasonCard(rounds, state.activeYear);
  }

  html += `<div class="card">
    <h3 style="font-size:0.875rem; font-weight:600; color:#44403c; margin:0 0 0.75rem;">Verteilung der Schläge pro Bahn</h3>
    <div class="bar-chart">`;
  dist.forEach(d => {
    const h = Math.max((d.count / maxDist) * 100, 3);
    html += `<div class="bar-col">
      <div class="count font-mono">${d.count}</div>
      <div class="bar ${d.val===1?'ace':''}" style="height:${h}%;"></div>
      <div class="lbl">${d.label}</div>
    </div>`;
  });
  html += `</div></div>`;

  if (state.activeYear !== "all" && sorted.length > 1) {
    const byMonth = {};
    sorted.forEach(r => {
      const month = (r.date || "").slice(0,7); // YYYY-MM
      if (!month) return;
      if (!byMonth[month]) byMonth[month] = [];
      byMonth[month].push(r.scores.reduce((a,b)=>a+b,0));
    });
    const monthly = Object.keys(byMonth).sort().map(month => {
      const vals = byMonth[month];
      return { month, avg: vals.reduce((a,b)=>a+b,0) / vals.length };
    });
    if (monthly.length > 1) {
      const W = 320, H = 130, PADX = 8, PADY = 18;
      const avgs = monthly.map(m => m.avg);
      const minV = Math.min(...avgs), maxV = Math.max(...avgs);
      const range = (maxV - minV) || 1;
      const stepX = monthly.length > 1 ? (W - PADX*2) / (monthly.length - 1) : 0;
      const toY = v => PADY + (1 - (v - minV) / range) * (H - PADY*2 - 14);
      const pts = monthly.map((m,i) => ({ x: PADX + i*stepX, y: toY(m.avg) }));
      const linePoints = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const labelEvery = Math.max(1, Math.ceil(monthly.length / 6));
      const monthNames = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
      html += `<div class="card">
        <h3 style="font-size:0.875rem; font-weight:600; color:#44403c; margin:0 0 0.75rem;">📈 Verlauf: Schnitt pro Monat</h3>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
          <polyline points="${linePoints}" fill="none" stroke="#2D6A4F" stroke-width="2" />
          ${pts.map((p,i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#2D6A4F" />${i % labelEvery === 0 || i === pts.length-1 ? `<text x="${p.x.toFixed(1)}" y="${H-2}" font-size="8" fill="#a8a29e" text-anchor="middle">${monthNames[parseInt(monthly[i].month.slice(5,7),10)-1]} ${monthly[i].month.slice(2,4)}</text>` : ''}`).join('')}
          ${pts.map((p,i) => `<text x="${p.x.toFixed(1)}" y="${(p.y-6).toFixed(1)}" font-size="8" fill="#57534e" text-anchor="middle" font-family="monospace">${monthly[i].avg.toFixed(1)}</text>`).join('')}
        </svg>
      </div>`;
    }
  }

  if (state.activeYear !== "all" && sorted.length > 1) {
    const totalsArr = sorted.map(r => r.scores.reduce((a,b)=>a+b,0));
    const max = Math.max(...totalsArr), min = Math.min(...totalsArr);
    const range = (max - min) || 1;
    html += `<div class="card">
      <h3 style="font-size:0.875rem; font-weight:600; color:#44403c; margin:0 0 0.75rem;">Verlauf einzelner Runden</h3>
      <p style="font-size:0.72rem; color:#a8a29e; margin:-0.4rem 0 0.75rem;">Lange drücken für Ergebnisverteilung</p>
      <div class="trend-chart"
        ontouchstart="startLongPress('show-round-totals-dist')" ontouchend="cancelLongPress()" ontouchmove="cancelLongPress()"
        onmousedown="startLongPress('show-round-totals-dist')" onmouseup="cancelLongPress()" onmouseleave="cancelLongPress()">`;
    sorted.forEach((r, i) => {
      const total = totalsArr[i];
      const hpct = 15 + ((total - min) / range) * 85;
      html += `<div class="col">
        <div class="val font-mono">${total}</div>
        <div class="bar ${total <= PAR_TOTAL ? 'under' : ''}" style="height:${hpct}%;"></div>
        <div class="lbl">${formatDate(r.date).slice(0,5)}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  html += `<div class="card" style="padding:0;">
    <h3 style="font-size:0.875rem; font-weight:600; color:#44403c; padding:1rem 1rem 0.5rem; margin:0;">Bahn-Statistik</h3>
    <table class="hole-table">
      <thead><tr><th class="l">Bahn</th><th class="c">Par</th><th class="c">Schnitt</th><th class="c">Rang</th><th class="r">Asse</th></tr></thead>
      <tbody>`;
  holeStats.forEach(h => {
    const rankColor = h.rank === 1 ? '#059669' : h.rank === 18 ? '#e11d48' : '#57534e';
    html += `<tr data-action="show-hole-dist" data-hole="${h.hole}" style="cursor:pointer;">
      <td class="l">${h.hole}</td>
      <td style="color:#a8a29e;">${h.par}</td>
      <td class="font-mono" style="font-weight:600; color:${h.avg <= h.par ? '#059669' : '#e11d48'};">${h.avg.toFixed(1)}</td>
      <td class="font-mono" style="font-weight:600; color:${rankColor};">${h.rank}</td>
      <td class="r txt-ace" style="font-weight:600;">${h.aces ? `${h.aces} <span style="font-weight:400; color:#a8a29e; font-size:0.72rem;">(${h.aceRate.toFixed(0)}%)</span>` : '–'}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  html += renderQueryCard(player, getYears(player));

  return html;
}

// ============================================================
// Actions / event handling
// ============================================================
function attachHandlers() {
  const root = document.getElementById("root");
  if (!root) return; // DOM not ready yet

  root.querySelectorAll("[data-action]").forEach(el => {
    const action = el.dataset.action;
    if (action === "set-tournament-placement") return; // handled separately (text input)
    if (el.tagName === "INPUT" && el.type === "file") {
      // File inputs: use change event, never preventDefault (would block file picker)
      el.addEventListener("change", () => handleAction(action, el, null));
    } else if (el.tagName === "SELECT") {
      el.addEventListener("change", (ev) => { ev.preventDefault(); handleAction(action, el, ev); });
    } else if (el.tagName === "INPUT" && (el.type === "date" || el.type === "text" || el.type === "number")) {
      // Value inputs: react to the value changing. A click handler with
      // preventDefault() here would stop the date picker from opening at all.
      el.addEventListener("change", () => handleAction(action, el, null));
    } else {
      el.addEventListener("click", (ev) => { ev.preventDefault(); handleAction(action, el, ev); });
    }
  });

  // Enter key for new player inputs
  const newPlayerInput = document.getElementById("new-player-name");
  if (newPlayerInput) {
    newPlayerInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") handleAction("add-player");
    });
    newPlayerInput.focus();
  }
  const newEntryInput = document.getElementById("new-entry-player-name");
  if (newEntryInput) {
    newEntryInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") handleAction("add-entry-player", newEntryInput);
    });
  }
  const entryDate = document.getElementById("entry-date");
  if (entryDate) {
    entryDate.addEventListener("change", (ev) => {
      state.entry.date = ev.target.value;
      if (ev.target.value !== todayISO()) state.entry.time = "";
      else state.entry.time = nowTimeHHMM();
      render();
    });
  }
  const entryTime = document.getElementById("entry-time");
  if (entryTime) {
    entryTime.addEventListener("change", (ev) => {
      state.entry.time = ev.target.value;
    });
  }
  ["rf-year","rf-month","rf-day"].forEach(id => {
    const el2 = document.getElementById(id);
    if (el2) el2.addEventListener("change", (ev) => {
      const key = id.replace("rf-","");
      state.roundsFilter[key] = ev.target.value;
      if (key === "year") { state.roundsFilter.month = ""; state.roundsFilter.day = ""; }
      if (key === "month") { state.roundsFilter.day = ""; }
      render();
    });
  });
  ["mf-year","mf-month","mf-day"].forEach(id => {
    const el2 = document.getElementById(id);
    if (el2) el2.addEventListener("change", (ev) => {
      const key = id.replace("mf-","");
      state.mergeFilter[key] = ev.target.value;
      // Reset lower levels when higher changes
      if (key === "year") { state.mergeFilter.month = ""; state.mergeFilter.day = ""; }
      if (key === "month") { state.mergeFilter.day = ""; }
      state.mergeSelectedIds = [];
      render();
    });
  });
}

function handleAction(action, el, ev) {
  const e = state.entry;

  switch (action) {
    case "set-view":
      state.view = el.dataset.view;
      if (state.view === "balls") loadBallsFromGithub();
      render();
      break;

    case "set-view-select":
      state.view = el.value;
      if (state.view === "balls") loadBallsFromGithub();
      render();
      break;

    case "switch-player":
      state.activePlayerId = el.value;
      state.activeYear = "all";
      state.query.result = null; state.queryExportText = null;
      render();
      break;

    case "switch-dashboard-player":
      state.dashboardPlayerId = el.value;
      render();
      break;

    case "switch-year":
      state.activeYear = el.value;
      render();
      break;

    case "goto-settings-players":
      state.view = "settings";
      state.collapsed.players = false;
      state.editingPlayerId = null;
      render();
      break;

    case "toggle-win-filter": {
      const pid = el.dataset.pid || "";
      state.roundsWinFilter = state.roundsWinFilter === pid || !pid ? null : pid;
      render();
      break;
    }

    case "rounds-filter-mode":
      state.roundsFilter.mode = el.dataset.mode || "any";
      render();
      break;

    case "rounds-filter-toggle-player": {
      const id = el.dataset.id;
      const pos = state.roundsFilter.playerIds.indexOf(id);
      if (pos >= 0) state.roundsFilter.playerIds.splice(pos, 1);
      else state.roundsFilter.playerIds.push(id);
      render();
      break;
    }

    case "rounds-filter-clear":
      state.roundsFilter = { playerIds: [], year: "", month: "", day: "", mode: "any" };
      state.roundsWinFilter = null;
      render();
      break;

    case "result-continue":
      state.lastSavedResult = null;
      state.view = "rounds";
      render();
      break;

    case "edit-player-name":
      state.editingPlayerId = el.dataset.id;
      render();
      break;

    case "save-player-name": {
      const id = el.dataset.id;
      const input = document.getElementById("edit-player-name-" + id);
      const name = input?.value.trim();
      if (name) {
        const player = state.players.find(p => p.id === id);
        if (player) player.name = name;
        persist();
      }
      state.editingPlayerId = null;
      render();
      break;
    }

    case "move-player-up": {
      const id = el.dataset.id;
      const idx = state.players.findIndex(p => p.id === id);
      if (idx > 0) {
        const [p] = state.players.splice(idx, 1);
        state.players.splice(idx - 1, 0, p);
        persist();
        render();
      }
      break;
    }

    case "move-player-down": {
      const id = el.dataset.id;
      const idx = state.players.findIndex(p => p.id === id);
      if (idx >= 0 && idx < state.players.length - 1) {
        const [p] = state.players.splice(idx, 1);
        state.players.splice(idx + 1, 0, p);
        persist();
        render();
      }
      break;
    }

    case "close-modal":
      state.showAddPlayer = false;
      render();
      break;

    case "add-player": {
      const input = document.getElementById("new-player-name");
      const name = input.value.trim();
      if (!name) return;
      const np = { id: uid(), name, rounds: [] };
      state.players.push(np);
      state.activePlayerId = np.id;
      persist();
      render();
      break;
    }

    case "remove-player": {
      const id = el.dataset.id;
      const player = state.players.find(p => p.id === id);
      if (!player) return;
      openConfirm(`${player.name} und alle ${player.rounds.length} Runden wirklich entfernen?`, "do-remove-player", { id });
      break;
    }

    case "delete-round": {
      const id = el.dataset.id;
      const playerId = el.dataset.player;
      const player = state.players.find(p => p.id === playerId) || getActivePlayer();
      const round = player?.rounds.find(r => r.id === id);
      const groupId = round?.groupId || null;
      const sameDayCount = groupId ? state.players.reduce((n,p) => n + p.rounds.filter(r => r.groupId === groupId).length, 0) : 1;
      const msg = sameDayCount > 1 ? `Diese Runde (${sameDayCount} Eintragungen) wirklich löschen?` : "Diese Runde wirklich löschen?";
      openConfirm(msg, "do-delete-round", { id, playerId: player?.id, groupId });
      break;
    }

    case "do-remove-player": {
      const { id } = state.confirmModal.payload;
      markDeleted("players", id);
      state.players = state.players.filter(p => p.id !== id);
      if (state.activePlayerId === id && state.players.length) {
        state.activePlayerId = state.players[0].id;
      }
      persist();
      closeConfirm();
      render();
      githubAutoSync();
      break;
    }

    case "do-delete-round": {
      const { id, playerId, groupId } = state.confirmModal.payload;
      if (groupId) {
        state.players.forEach(p => {
          p.rounds.filter(r => r.groupId === groupId).forEach(r => markDeleted("rounds", r.id));
          p.rounds = p.rounds.filter(r => r.groupId !== groupId);
        });
        if (state.tournamentPlacements[groupId]) {
          delete state.tournamentPlacements[groupId];
          persistTournamentPlacements();
        }
      } else {
        const player = state.players.find(p => p.id === playerId) || getActivePlayer();
        if (player) {
          markDeleted("rounds", id);
          player.rounds = player.rounds.filter(r => r.id !== id);
        }
      }
      persist();
      closeConfirm();
      render();
      githubAutoSync();
      break;
    }

    case "do-delete-accessory": {
      const { id } = state.confirmModal.payload;
      state.accessories = state.accessories.filter(a => a.id !== id);
      persistAccessories();
      closeConfirm();
      render();
      (async () => {
        const syncResult = await githubAutoSync();
        if (!syncResult.ok) showToast(`⚠️ Lokal gelöscht, GitHub-Sync fehlgeschlagen: ${syncResult.reason || "unbekannt"}`);
      })();
      break;
    }

    case "do-delete-gastro": {
      const { id } = state.confirmModal.payload;
      state.gastro = state.gastro.filter(g => g.id !== id);
      persistGastro();
      closeConfirm();
      render();
      (async () => {
        const syncResult = await githubAutoSync();
        if (!syncResult.ok) showToast(`⚠️ Lokal gelöscht, GitHub-Sync fehlgeschlagen: ${syncResult.reason || "unbekannt"}`);
      })();
      break;
    }

    case "confirm-cancel":
      closeConfirm();
      render();
      break;

    case "download-app-html": {
      const source = document.documentElement.outerHTML;
      const blob = new Blob(["<!DOCTYPE html>\n" + source], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("index.html heruntergeladen ✓");
      break;
    }

    case "export-data": {
      const json = JSON.stringify(buildExportBundle(), null, 2);
      state.exportData = json;
      state.showExportModal = true;
      render();
      // try to auto-copy immediately
      attemptCopy(json);
      break;
    }

    case "close-export-modal":
      state.showExportModal = false;
      state.exportData = null;
      render();
      break;

    case "copy-export-data": {
      const ta = document.getElementById("export-textarea");
      if (ta) {
        ta.focus();
        ta.select();
      }
      attemptCopy(state.exportData);
      break;
    }

    case "round-edit-open":
      state.detailRound.editing = true;
      render();
      break;

    case "round-edit-cancel":
      state.detailRound.editing = false;
      render();
      break;

    case "round-edit-balls-open":
      state.detailRound.editingBalls = true;
      state.detailRound.editing = false;
      state.detailRound.pickingHole = null;
      render();
      break;

    case "round-edit-balls-close":
      state.detailRound.editingBalls = false;
      state.detailRound.pickingHole = null;
      render();
      break;

    case "round-ball-pick": {
      const pid2 = el.dataset.player;
      const rid2 = el.dataset.round;
      const holeIdx2 = parseInt(el.dataset.hole);
      const cur = state.detailRound.pickingHole;
      if (cur && cur.roundId === rid2 && cur.hole === holeIdx2) {
        state.detailRound.pickingHole = null;
      } else {
        state.detailRound.pickingHole = { playerId: pid2, roundId: rid2, hole: holeIdx2 };
      }
      render();
      break;
    }

    case "round-set-hole-ball": {
      const pid3 = el.dataset.player;
      const rid3 = el.dataset.round;
      const holeIdx3 = parseInt(el.dataset.hole);
      const ballId3 = el.dataset.ball || null;
      const p3 = state.players.find(pl => pl.id === pid3);
      const r3 = p3 ? p3.rounds.find(rr => rr.id === rid3) : null;
      if (r3) {
        if (!r3.ballsByHole) r3.ballsByHole = [];
        r3.ballsByHole[holeIdx3] = ballId3;
        r3.ballsUpdatedAt = Date.now();
        persist();
        scheduleGithubSync();
        showToast("Ball gespeichert ✓");
      }
      state.detailRound.pickingHole = null;
      render();
      break;
    }

    case "round-save-edit": {
      const newDate = document.getElementById("edit-round-date")?.value.trim();
      const newTime = document.getElementById("edit-round-time")?.value.trim();
      if (!newDate) return;
      const { playerId: drPid, roundId: drRid } = state.detailRound;
      const entries = getRoundEntries(drPid, drRid);
      entries.forEach(({ player, round }) => {
        round.date = newDate;
        round.year = newDate.slice(0, 4);
        if (newTime) round.time = newTime;
        else delete round.time;
      });
      persist();
      githubAutoSync();
      state.detailRound.editing = false;
      showToast("Datum gespeichert ✓");
      render();
      break;
    }

    case "round-ungroup": {
      openConfirm("Zusammenführung wirklich aufheben? Die Runden werden wieder einzeln angezeigt.", "confirm-round-ungroup", {
        playerId: state.detailRound.playerId,
        roundId: state.detailRound.roundId,
      });
      break;
    }

    case "confirm-round-ungroup": {
      const { playerId: drPid, roundId: drRid } = state.confirmModal?.payload || {};
      if (drPid && drRid) {
        const entries = getRoundEntries(drPid, drRid);
        entries.forEach(({ round }) => { delete round.groupId; });
        persist();
        githubAutoSync();
        showToast("Zusammenführung aufgehoben.");
      }
      closeConfirm();
      state.detailRound = null;
      render();
      break;
    }

    case "round-add-player": {
      const sel = document.getElementById("edit-add-player-sel");
      const addPid = sel?.value;
      if (!addPid) { showToast("Bitte zuerst einen Spieler wählen."); return; }
      const { playerId: drPid, roundId: drRid } = state.detailRound;
      const entries = getRoundEntries(drPid, drRid);
      const groupId = entries[0]?.round?.groupId;
      if (!groupId) { showToast("Runde hat keine Gruppe."); return; }
      // Check if player has a round on the same date without groupId
      const targetPlayer = state.players.find(p => p.id === addPid);
      const repDate = entries[0]?.round?.date;
      const matchRound = targetPlayer?.rounds.find(r => r.date === repDate && !r.groupId);
      if (matchRound) {
        matchRound.groupId = groupId;
        persist();
        githubAutoSync();
        showToast(`${targetPlayer.name} zur Runde hinzugefügt ✓`);
      } else {
        showToast(`Keine unverknüpfte Runde von ${targetPlayer?.name} am ${repDate} gefunden.`);
      }
      render();
      break;
    }

    case "toggle-ball-tasks":
      state.collapsed.ballTasks = !state.collapsed.ballTasks;
      render();
      break;

    case "bulk-ball-field": {
      if (!state.bulkBallReplace) state.bulkBallReplace = {};
      state.bulkBallReplace[el.dataset.field] = el.value;
      render();
      break;
    }

    case "bulk-ball-apply": {
      const matches = findBulkBallMatches();
      if (matches.length === 0) break;
      const r = state.bulkBallReplace;
      const ball = r.newBall === "__none__" ? null : state.balls.find(b => b.id === r.newBall);
      const ballLabel = ball ? [ball.manufacturer, ball.series, ball.name].filter(Boolean).join(" ") : "kein Ball";
      openConfirm(`Bahn ${r.hole} in ${matches.length} Runde(n) auf "${ballLabel}" setzen?`, "do-bulk-ball-apply", {}, { confirmLabel: "Ändern", confirmColor: "#2D6A4F" });
      break;
    }

    case "do-bulk-ball-apply": {
      const matches = findBulkBallMatches();
      const r = state.bulkBallReplace;
      const idx = parseInt(r.hole, 10) - 1;
      const newId = r.newBall === "__none__" ? null : r.newBall;
      const stamp = Date.now();
      matches.forEach(round => {
        if (!round.ballsByHole) round.ballsByHole = [];
        round.ballsByHole[idx] = newId;
        round.ballsUpdatedAt = stamp;
      });
      persist();
      closeConfirm();
      showToast(`${matches.length} Runde(n) geändert ✓`);
      render();
      // One batched upload for the whole change, not one per round.
      scheduleGithubSync(1500);
      break;
    }

    case "retry-sync":
      showToast("Sichern wird erneut versucht…");
      githubAutoSync();
      break;

    case "toggle-ball-hole-rounds": {
      const hole = parseInt(el.dataset.hole, 10);

      } else if (type === "aces") {
        title = "Meiste Asse in Folge";
        items = rounds.map(r => ({ round: r, value: longestAceStreakInRound(r) }))
          .filter(it => it.value > 0)
          .sort((a,b) => b.value - a.value || (a.round.date < b.round.date ? 1 : -1))
          .slice(0, 10);
      } else if (type === "clean") {
        title = "Fehlerfreie Runden";
        items = rounds.filter(r => r.scores.every((s,i) => s <= PARS[i]))
          .map(r => ({ round: r, value: r.scores.reduce((a,b)=>a+b,0) }))
          .sort((a,b) => a.round.date < b.round.date ? 1 : -1);
      }
      state.statsListModal = { type, title, items, playerId: player ? player.id : null };
      render();
      break;
    }

    case "close-stats-list":
      state.statsListModal = null;
      render();
      break;

    case "show-hole-dist": {
      const holeNum = parseInt(el.dataset.hole);
      const idx = holeNum - 1;
      const player = getActivePlayer();
      const rounds = getFilteredRounds(player);
      const vals = rounds.map(r => r.scores[idx]);
      const dist = [1,2,3,4,5,6,7].map(v => ({ val: v, label: v===7?'7+':String(v), count: vals.filter(s => v === 7 ? s >= 7 : s === v).length }));
      state.statsListModal = { type: "dist", title: `Bahn ${holeNum} – Ergebnisse`, dist, total: vals.length, unit: "Runden auf dieser Bahn" };
      render();
      break;
    }

    case "show-round-totals-dist": {
      const player = getActivePlayer();
      const rounds = getFilteredRounds(player);
      const totals = rounds.map(r => r.scores.reduce((a,b)=>a+b,0));
      const counts = {};
      totals.forEach(t => counts[t] = (counts[t]||0) + 1);
      const dist = Object.keys(counts).map(k => ({ val: parseInt(k,10), label: k, count: counts[k] })).sort((a,b) => a.val - b.val);
      state.statsListModal = { type: "dist", title: "Rundenergebnisse (Gesamt)", dist, total: totals.length, unit: "Runden insgesamt" };
      render();
      break;
    }

    case "show-ball-hole-detail": {
      const ballId = el.dataset.ball;
      const label = el.dataset.label || "Ball";
      const details = getBallHoleDetails(ballId, getBallStatsFilter());
      state.statsListModal = { type: "ballHoles", title: `${label} – pro Bahn`, ballId, label, perHole: details.perHole };
      state.ballHoleExpanded = null;
      render();
      break;
    }

    case "ball-stats-filter": {
      getBallStatsFilter()[el.dataset.field] = el.value;
      const m = state.statsListModal;
      if (m && m.ballId) {
        m.perHole = getBallHoleDetails(m.ballId, getBallStatsFilter()).perHole;
      }
      state.ballHoleExpanded = null;
      render();
      break;
    }

    // ---------- Gastronomie (Dashboard quick entry) ----------
    case "open-gastro-quick":
      state.gastroQuickModal = true;
      render();
      break;

    case "close-gastro-quick":
      state.gastroQuickModal = false;
      render();
      break;

    case "save-gastro-quick": {
      const date = document.getElementById("gastro-quick-date")?.value || todayISO();
      const drinks = parseDecimal(document.getElementById("gastro-quick-drinks")?.value) || 0;
      const snacks = parseDecimal(document.getElementById("gastro-quick-snacks")?.value) || 0;
      const icecream = parseDecimal(document.getElementById("gastro-quick-icecream")?.value) || 0;
      const result = saveGastroEntry(date, drinks, snacks, icecream);
      if (!result.ok) { showToast("Bitte mindestens einen Betrag eingeben."); return; }
      state.gastroQuickModal = false;
      showToast(`Speichere ${result.total.toFixed(2).replace('.',',')} € …`);
      render();
      (async () => {
        const syncResult = await githubAutoSync();
        showToast(syncResult.ok ? `✓ ${result.total.toFixed(2).replace('.',',')} € auf GitHub gespeichert` : `⚠️ Nur lokal gespeichert – GitHub-Sync fehlgeschlagen: ${syncResult.reason || "unbekannt"}`);
      })();
      break;
    }

    // ---------- Ball-Datenbank ----------
    case "sync-tournament-balls": {
      const beforeCount = getBallsFromTournament().length;
      showToast("Synchronisiere Turnier-Bälle …");
      (async () => {
        const changed = await syncTournamentBallsIntoDB();
        render();
        if (changed) {
          showToast(`✓ ${beforeCount} Turnier-Ball/Bälle übernommen – synchronisiere …`);
          const result = await githubAutoSync();
          showToast(result.ok ? "✓ Auf GitHub gespeichert" : "⚠️ Sync fehlgeschlagen: " + (result.reason || "unbekannt"));
        } else {
          showToast(beforeCount > 0 ? "Bereits aktuell ✓" : "Keine Turnier-Bälle gefunden (noch keine Runde mit Sprunghöhe/Härte/Gewicht/Foto gespeichert).");
        }
      })();
      break;
    }

    case "ball-open-add": {
      const draft = loadBallDraft();
      const ball = draft || { photo: null, photo2: null, manufacturer: "", series: "", name: "", jumpHeight: "", hardness: "", weight: "", color: "", notes: "" };
      state.ballModal = { mode: "add", ball, searchQuery: "", showPhoto2: !!(ball.photo2) };
      if (draft) showToast("Entwurf wiederhergestellt 💾");
      render();
      break;
    }

    case "ball-modal-close": {
      if (!state.ballModal) return;
      // Capture current field values before closing
      const manufacturer = document.getElementById("ball-manufacturer")?.value.trim() || "";
      const series = document.getElementById("ball-series")?.value.trim() || "";
      const name = document.getElementById("ball-name")?.value.trim() || "";
      const jumpHeight = document.getElementById("ball-jump")?.value.trim() || "";
      const hardness = document.getElementById("ball-hardness")?.value.trim() || "";
      const weight = document.getElementById("ball-weight")?.value.trim() || "";
      const color = document.getElementById("ball-color")?.value.trim() || "";
      const notes = document.getElementById("ball-notes")?.value.trim() || "";
      const hasData = manufacturer || series || name || jumpHeight || hardness || weight || color || notes || state.ballModal.ball.photo || state.ballModal.ball.photo2;
      if (hasData && state.ballModal.mode === "add") {
        // Save draft so nothing is lost
        saveBallDraft({ ...state.ballModal.ball, manufacturer, series, name, jumpHeight, hardness, weight, color, notes });
        showToast("Entwurf gespeichert – beim nächsten Öffnen wiederhergestellt 💾");
      } else {
        clearBallDraft();
      }
      state.ballModal = null;
      render();
      break;
    }

    case "ball-do-search": {
      const q = document.getElementById("ball-search-q")?.value.trim() || "";
      if (state.ballModal) state.ballModal.searchQuery = q;
      if (q) window.open("https://www.google.com/search?q=" + encodeURIComponent(q + " Minigolfball"), "_blank");
      render();
      break;
    }

    case "ball-ai-scan": {
      if (!state.ballModal) return;
      const m = state.ballModal;
      const photoData = m.ball.photo || m.ball.photo2;
      if (!photoData) return;
      m.scanning = true;
      m.scanError = null;
      m.scanDone = false;
      render();

      // Extract base64 data and media type
      const match = photoData.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
      if (!match) { m.scanning = false; m.scanError = "Foto-Format nicht erkannt."; render(); return; }
      const mediaType = match[1];
      const base64Data = match[2];

      (async () => {
        try {
          const apiKey = loadClaudeApiKey();
          if (!apiKey) {
            state.ballModal.scanning = false;
            state.ballModal.scanError = "Kein API-Key hinterlegt. Bitte in Einstellungen → KI-Analyse den Anthropic API-Key eintragen.";
            render();
            return;
          }
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true",
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 1000,
              messages: [{
                role: "user",
                content: [
                  {
                    type: "image",
                    source: { type: "base64", media_type: mediaType, data: base64Data }
                  },
                  {
                    type: "text",
                    text: `Du siehst ein Foto eines Minigolfballs. Analysiere das Bild sehr genau und suche nach allen sichtbaren Aufdrucken, Zahlen, Logos und Texten.

Antworte NUR mit einem JSON-Objekt, ohne Markdown-Backticks, ohne Erklärungen, ohne zusätzlichen Text. Leere Felder bleiben "".

{
  "manufacturer": "",
  "series": "",
  "name": "",
  "color": "",
  "jumpHeight": "",
  "hardness": "",
  "weight": ""
}

Hinweise zur Erkennung:
- manufacturer: Hersteller/Marke (z.B. "Tretorn", "Argusette", "City Minigolf Düsseldorf")
- series: Produktlinie oder Turnierserie (z.B. "TP30", "Einballturnier")
- name: Modellname, Jahreszahl oder Nummer auf dem Ball
- color: sichtbare Farbe des Balls (z.B. "Schwarz", "Weiß", "Gelb")
- jumpHeight: Sprunghöhe in cm falls sichtbar als Zahl (z.B. "39") - oft als "39 cm" oder "H:39" aufgedruckt
- hardness: Härte/Shore-Wert falls sichtbar als Zahl (z.B. "79") - oft als "Shore 79" oder "H79" aufgedruckt  
- weight: Gewicht in Gramm falls sichtbar als Zahl (z.B. "42.5") - oft als "42g" oder "42,5g" aufgedruckt

Gib nur Werte an die du wirklich auf dem Ball siehst. Erfinde keine Daten.`
                  }
                ]
              }]
            })
          });

          const data = await response.json();
          const text = (data.content || []).map(c => c.text || "").join("").trim();
          const clean = text.replace(/```json|```/g, "").trim();
          const parsed = JSON.parse(clean);

          // Merge into ball, only overwrite empty fields
          const ball = state.ballModal.ball;
          for (const key of ["manufacturer", "series", "name", "color", "jumpHeight", "hardness", "weight"]) {
            if (parsed[key] && !ball[key]) ball[key] = parsed[key];
          }
          state.ballModal.scanning = false;
          state.ballModal.scanDone = true;
          render();
        } catch (err) {
          state.ballModal.scanning = false;
          state.ballModal.scanError = "Analyse fehlgeschlagen: " + (err.message || "Unbekannter Fehler");
          render();
        }
      })();
      break;
    }

    case "ball-add-second-photo":
      if (state.ballModal) state.ballModal.showPhoto2 = true;
      render();
      break;

    case "ball-upload-photo": {
      const num = el.dataset.num;
      const file = el.files?.[0];
      if (!file || !state.ballModal) return;
      const key = num === "1" ? "photo" : "photo2";
      (async () => {
        try {
          state.ballModal.ball[key] = await compressImageFile(file);
        } catch(e) {
          // Fallback: store raw if compression fails for some reason
          const reader = new FileReader();
          reader.onload = (ev2) => { state.ballModal.ball[key] = ev2.target.result; render(); };
          reader.readAsDataURL(file);
          return;
        }
        render();
      })();
      break;
    }

    case "ball-clear-photo": {
      const num = el.dataset.num;
      if (!state.ballModal) return;
      const key = num === "1" ? "photo" : "photo2";
      state.ballModal.ball[key] = null;
      render();
      break;
    }

    case "ball-save": {
      if (!state.ballModal) return;
      const m = state.ballModal;
      const manufacturer = document.getElementById("ball-manufacturer")?.value.trim() || "";
      const series = document.getElementById("ball-series")?.value.trim() || "";
      const name = document.getElementById("ball-name")?.value.trim() || "";
      const jumpHeight = document.getElementById("ball-jump")?.value.trim() || "";
      const hardness = document.getElementById("ball-hardness")?.value.trim() || "";
      const weight = document.getElementById("ball-weight")?.value.trim() || "";
      const color = document.getElementById("ball-color")?.value.trim() || "";
      const notes = document.getElementById("ball-notes")?.value.trim() || "";
      if (!name && !manufacturer) { showToast("Bitte mindestens Hersteller oder Name eingeben."); return; }
      const ballData = { ...m.ball, manufacturer, series, name, jumpHeight, hardness, weight, color, notes };
      if (m.mode === "edit") {
        const idx = state.balls.findIndex(b => b.id === m.ball.id);
        if (idx >= 0) state.balls[idx] = { ...state.balls[idx], ...ballData };
      } else {
        state.balls.push({ id: uid(), ...ballData });
      }
      persistBalls();
      clearBallDraft();
      state.ballModal = null;
      showToast(m.mode === "edit" ? "Ball aktualisiert ✓" : "Ball hinzugefügt ✓");
      githubAutoSync();
      render();
      break;
    }

    case "ball-edit": {
      const id = el.dataset.id;
      const ball = state.balls.find(b => b.id === id);
      if (!ball) return;
      state.ballModal = { mode: "edit", ball: { ...ball }, searchQuery: "", showPhoto2: !!(ball.photo2) };
      render();
      break;
    }

    case "ball-delete": {
      const id = el.dataset.id;
      openConfirm("Diesen Ball wirklich aus der Datenbank löschen?", "do-ball-delete", { id });
      break;
    }

    case "do-ball-delete": {
      const id = state.confirmModal?.payload?.id;
      if (id) {
        state.balls = state.balls.filter(b => b.id !== id);
        persistBalls();
        showToast("Ball gelöscht.");
      }
      closeConfirm();
      render();
      break;
    }

    // ---------- Abfrage ----------

    case "query-period-year": {
      const cur = parsePeriod(state.query.period);
      state.query.period = buildPeriod(el.value, cur.month);
      state.query.result = null; state.queryExportText = null;
      render();
      break;
    }

    case "query-period-month": {
      const cur = parsePeriod(state.query.period);
      state.query.period = buildPeriod(cur.year, el.value);
      state.query.result = null; state.queryExportText = null;
      render();
      break;
    }

    case "query-periodB-year": {
      const cur = parsePeriod(state.query.periodB);
      state.query.periodB = buildPeriod(el.value, cur.month);
      state.query.result = null; state.queryExportText = null;
      render();
      break;
    }

    case "query-periodB-month": {
      const cur = parsePeriod(state.query.periodB);
      state.query.periodB = buildPeriod(cur.year, el.value);
      state.query.result = null; state.queryExportText = null;
      render();
      break;
    }

    case "query-toggle-compare":
      state.query.compareEnabled = !state.query.compareEnabled;
      state.query.result = null; state.queryExportText = null;
      render();
      break;

    case "query-mode": {
      const mode = el.dataset.mode;
      state.query.mode = mode;
      if (mode === "aces") {
        state.query.operator = ">=";
        state.query.value = 1;
      } else if (mode === "errors") {
        state.query.operator = "=";
        state.query.value = 0;
      } else if (mode === "total" && state.query.value === 0) {
        state.query.value = PAR_TOTAL;
      }
      state.query.result = null; state.queryExportText = null;
      render();
      break;
    }

    case "query-allholes":
      state.query.allHoles = !state.query.allHoles;
      if (state.query.allHoles) state.query.holes = [];
      state.query.result = null; state.queryExportText = null;
      render();
      break;

    case "query-toggle-hole": {
      const idx = parseInt(el.dataset.idx);
      const pos = state.query.holes.indexOf(idx);
      if (pos >= 0) state.query.holes.splice(pos, 1);
      else state.query.holes.push(idx);
      state.query.result = null; state.queryExportText = null;
      render();
      break;
    }

    case "query-operator":
      state.query.operator = el.dataset.op;
      state.query.result = null; state.queryExportText = null;
      render();
      break;

    case "run-query": {
      const valInput = document.getElementById("query-value");
      if (valInput) {
        const v = parseFloat(valInput.value);
        state.query.value = isNaN(v) ? 0 : v;
      }
      state.queryExportText = null;
      evaluateQuery(getActivePlayer());
      render();
      break;
    }

    case "export-query-result": {
      const q = state.query;
      const r = q.result;
      if (!r) return;
      const player = getActivePlayer();
      const modeLabel = { total: "Gesamtschläge", hole: "Einzelne Bahn(en)", aces: "Asse pro Runde", errors: "Fehler pro Runde" }[q.mode] || q.mode;
      const opLabel = { "=": "=", "<=": "<=", ">=": ">=" }[q.operator] || q.operator;
      const lines = [];
      lines.push(`Minigolf Abfrage - ${player.name}`);
      lines.push(`Zeitraum: ${periodLabel(q.period)}`);
      lines.push(`Kriterium: ${modeLabel} ${opLabel} ${q.value}`);
      lines.push(`Treffer: ${r.matches} von ${r.total} (${r.total>0?(r.matches/r.total*100).toFixed(1).replace('.',','):'0'} %)`);
      if (q.compareEnabled && q.resultB) {
        const rB = q.resultB;
        lines.push(`Vergleich ${periodLabel(q.periodB)}: ${rB.matches} von ${rB.total} (${rB.total>0?(rB.matches/rB.total*100).toFixed(1).replace('.',','):'0'} %)`);
      }
      lines.push("");
      lines.push("Datum;Gesamt;Asse;Fehler");
      r.matchedRounds.forEach(round => {
        const total = round.scores.reduce((a,b)=>a+b,0);
        lines.push(`${formatDate(round.date)};${total};${roundAces(round)};${roundErrors(round)}`);
      });
      const text = lines.join("\n");
      state.queryExportText = text;
      attemptCopy(text);
      render();
      break;
    }
  }
}

// ============================================================
// Init
// ============================================================

// Lock to portrait, prevent pinch-zoom gestures
try {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("portrait").catch(() => {});
  }
} catch(e) {}

document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturechange", e => e.preventDefault(), { passive: false });
document.addEventListener("gestureend", e => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", e => {
  if (e.scale && e.scale !== 1) e.preventDefault();
}, { passive: false });

render();

// Auto-load balls on startup via raw GitHub URL, then mirror tournament-derived
// balls into the real balls list so they're written to minigolf-baelle.json
// (and therefore show up in training.html). Sequenced as a single flow (rather
// than two competing startup tasks) to avoid overlapping GitHub writes.
(async function autoLoadBallsOnStart() {
  try {
    const cfg = loadGithubConfig();
    if (!cfg || !cfg.owner || !cfg.repo) return;
    const branch = cfg.branch || "main";
    const dataPath = cfg.path || "minigolf-daten.json";
    const dir = dataPath.includes("/") ? dataPath.substring(0, dataPath.lastIndexOf("/") + 1) : "";
    try {
      const ballsData = await githubFetchJson(cfg, branch, dir + "minigolf-baelle.json");
      if (Array.isArray(ballsData.balls) && ballsData.balls.length > 0) {
        const localById = {};
        state.balls.forEach(b => { if (b.id) localById[b.id] = b; });
        ballsData.balls.forEach(b => { if (b.id) localById[b.id] = b; });
        const merged = Object.values(localById);
        if (merged.length !== state.balls.length) {
          state.balls = merged;
          persistBalls();
          render();
        }
      }
    } catch(e) { /* balls file unreachable - keep local balls */ }
    if (await syncTournamentBallsIntoDB()) {
      render();
      githubAutoSync();
    }
  } catch(e) {}
})();

// Pulls the latest data from GitHub and merges it in, via the Contents API
// so the result always reflects the newest commit (see githubFetchJson).
// Merge-only and additive - never pushes, so a device that hasn't seen a
// round yet can never overwrite what's already on GitHub. Use "Auf GitHub
// sichern" to push.
async function pullFromGithub() {
  try {
    const cfg = loadGithubConfig();
    if (!cfg || !cfg.owner || !cfg.repo) return;
    const branch = cfg.branch || "main";
    const path = cfg.path || "minigolf-daten.json";
    const data = await githubFetchJson(cfg, branch, path);
    const beforeCount = state.players.reduce((n, p) => n + (p.rounds || []).length, 0);
    const beforePaused = loadPausedRounds().length;
    if (applyImportedBundle(data)) {
      const afterCount = state.players.reduce((n, p) => n + (p.rounds || []).length, 0);
      const afterPaused = loadPausedRounds().length;
      const roundDiff = afterCount - beforeCount;
      const pausedDiff = afterPaused - beforePaused;
      if (roundDiff !== 0 || pausedDiff !== 0) {
        const parts = [];
        if (roundDiff !== 0) parts.push(`+${roundDiff} Runde(n)`);
        if (pausedDiff !== 0) parts.push(`+${pausedDiff} pausierte`);
        addSyncEntry("load", `Automatisch synchronisiert (${parts.join(", ")})`);
      }
    }
  } catch(e) {
  } finally {
    // Always mark this done - on success, on failure, and when GitHub isn't
    // set up at all - otherwise the task card would stay hidden forever on a
    // device that can't reach GitHub.
    // Also pull the training sessions so the in-round ball recommendation
    // works on a device where the Einheiten page hasn't been opened.
    try {
      const cfg2 = loadGithubConfig();
      if (cfg2 && cfg2.owner && cfg2.repo) {
        const dir2 = (cfg2.path || "minigolf-daten.json").includes("/")
          ? (cfg2.path || "").substring(0, (cfg2.path || "").lastIndexOf("/") + 1) : "";
        const sess = await githubFetchJson(cfg2, cfg2.branch || "main", dir2 + "minigolf-einheiten.json");
        if (sess && Array.isArray(sess.sessions)) {
          localStorage.setItem(TRAINING_SESSIONS_KEY, JSON.stringify({ sessions: sess.sessions }));
        }
      }
    } catch(e) { /* recommendations simply fall back to round data */ }

    state.initialSyncDone = true;
    render();
    // If a previous session ended with changes GitHub never accepted, retry
    // now that we're back online rather than leaving them stranded.
    if (isSyncDirty()) {
      setSyncStatus("pending");
      githubAutoSync();
    }
  }
}

// Opened from another page with ?round=..&player=..&back=training&hole=..
// Jumps straight into that round and offers a way back, so the training
// statistics can link into a round without losing the trail.
(function openRoundFromUrl() {
  try {
    const q = new URLSearchParams(location.search);
    const roundId = q.get('round');
    const playerId = q.get('player');
    if (!roundId || !playerId) return;
    state.detailRound = { playerId, roundId };
    if (q.get('back') === 'training') {
      const hole = parseInt(q.get('hole'), 10);
      state.backLink = 'training.html' + (hole >= 1 && hole <= 18 ? `?hole=${hole}` : '');
    }
    render();
  } catch(e) {}
})();

// Delayed briefly on startup so the device's network stack is ready right
// after launch (a bare startup request appeared to fail otherwise).
setTimeout(pullFromGithub, 1500);

// Also re-pull whenever the app comes back to the foreground, so a paused
// round (or a season's ball setup) started on the other device shows up
// without having to fully restart the app. Throttled so switching apps
// rapidly doesn't hammer GitHub.
let lastForegroundPull = Date.now();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (Date.now() - lastForegroundPull < 30000) return; // at most once every 30s
  lastForegroundPull = Date.now();
  pullFromGithub();
});

checkCityMinigolfNews();
</script>
