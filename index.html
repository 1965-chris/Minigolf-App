}

// Downscale + re-compress a photo before storing it, so a raw iPhone photo
// (often 3-6 MB) becomes a small JPEG (~100-150 KB). Used for ball photos.
function compressImageFile(file, maxDim = 1000, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
      else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

// Same idea, but for images already stored as a data: URL (e.g. older tournament
// photos uploaded before compression existed) - downscales/re-encodes in place.
// Skips already-small images to avoid needless work.
function compressDataUrl(dataUrl, maxDim = 1000, quality = 0.72) {
  return new Promise((resolve) => {
    if (!dataUrl || typeof dataUrl !== "string" || !dataUrl.startsWith("data:image")) { resolve(dataUrl); return; }
    if (dataUrl.length < 150000) { resolve(dataUrl); return; } // already small (~<110KB binary)
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
      else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(dataUrl); // keep original if it fails to decode
    img.src = dataUrl;
  });
}

// iOS Safari only allows audio.play() without restriction when it's a DIRECT,
// synchronous result of a user gesture. Since we need to await a network
// fetch first, play() can get silently blocked afterwards. Workaround: prime
// one reusable <audio> element with a real play()+pause() during any early
// tap in the app - once "unlocked" this way, iOS keeps allowing playback on
// that same element for the rest of the session, even from async callbacks.
let __unlockedAudio = null;
// Best-effort "new content" check for the City Minigolf website: fetches the
// homepage and compares a cheap fingerprint against the last one seen. Only
// works if the site allows cross-origin requests (CORS) - if it doesn't,
// this silently does nothing and no badge appears (no error, no harm).
const CITY_MINIGOLF_FP_KEY = "minigolf-cityminigolf-fingerprint";
async function checkCityMinigolfNews() {
  try {
    const res = await fetch("https://cityminigolf.de/", { mode: "cors", cache: "no-store" });
    if (!res.ok) return;
    const text = await res.text();
    let hash = 0;
    for (let i = 0; i < text.length; i += 7) { // sample every 7th char - fast, still sensitive to real edits
      hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
    }
    const fingerprint = text.length + ":" + hash;
    const stored = localStorage.getItem(CITY_MINIGOLF_FP_KEY);
    if (stored && stored !== fingerprint) {
      state.cityMinigolfHasNews = true;
      render();
    }
    localStorage.setItem(CITY_MINIGOLF_FP_KEY, fingerprint);
  } catch(e) {
    // CORS-blocked or offline - fail silently, this is a best-effort feature
  }
}
function markCityMinigolfSeen() {
  state.cityMinigolfHasNews = false;
}

let __longPressTimer = null;
function startLongPress(action) {
  cancelLongPress();
  __longPressTimer = setTimeout(() => { handleAction(action, null, null); }, 550);
}
function cancelLongPress() {
  if (__longPressTimer) { clearTimeout(__longPressTimer); __longPressTimer = null; }
}

function unlockAudioPlayback() {
  if (__unlockedAudio) return;
  try {
    const a = new Audio();
    a.src = "data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgID/+xDECgAJyAP///wAAAAA//8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";
    a.volume = 0;
    const p = a.play();
    if (p && p.then) p.then(() => { a.pause(); a.volume = 1; }).catch(() => { a.volume = 1; });
  } catch(e) {}
  __unlockedAudio = true;
}
if (typeof document !== "undefined") {
  document.addEventListener("touchstart", unlockAudioPlayback, { once: true, passive: true });
  document.addEventListener("click", unlockAudioPlayback, { once: true });
}

// Premium TTS via Google Cloud Text-to-Speech - this is the ONLY announcement
// path (no browser-voice fallback), since Safari's Web Speech API can't reach
// the good iOS voices anyway (Apple restriction). Requires the user's own
// Google Cloud API key (kept local-only, never synced to GitHub).
// Returns {ok, reason} so callers (and "Stimme testen") can show what failed.
async function speakViaGoogleTTS(text) {
  const apiKey = state.googleTtsApiKey;
  if (!apiKey) return { ok: false, reason: "Kein Google-Cloud-Key hinterlegt" };
  const voiceName = (state.aceStreakSettings.googleVoiceName || "").trim() || "de-DE-Neural2-C";
  let response;
  try {
    response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${encodeURIComponent(apiKey)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        input: { text },
        voice: { languageCode: "de-DE", name: voiceName },
        audioConfig: { audioEncoding: "MP3" },
      }),
    });
  } catch(e) {
    return { ok: false, reason: "Netzwerk-/CORS-Fehler beim Abruf: " + (e.message || "?") };
  }
  if (!response.ok) {
    let detail = `HTTP ${response.status}`;
    try { const j = await response.json(); if (j?.error?.message) detail += ": " + j.error.message; } catch(e) {}
    return { ok: false, reason: detail };
  }
  try {
    const j = await response.json();
    if (!j.audioContent) return { ok: false, reason: "Keine Audiodaten in der Antwort" };
    const binary = atob(j.audioContent);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: "audio/mp3" });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => URL.revokeObjectURL(url);
    audio.onerror = () => URL.revokeObjectURL(url);
    await audio.play();
    return { ok: true };
  } catch(e) {
    return { ok: false, reason: "Wiedergabe blockiert: " + (e.name || e.message || "?") };
  }
}

async function speakAnnouncement(text) {
  try {
    if (!state.aceStreakSettings.speechEnabled) return { ok: false, reason: "Sprachansage deaktiviert" };
    return await speakViaGoogleTTS(text);
  } catch(e) {
    return { ok: false, reason: "Unerwarteter Fehler in speakAnnouncement: " + (e && e.message ? e.message : String(e)) };
  }
}

function scrollToFirstPlayerCard() {
  requestAnimationFrame(() => {
    const first = document.querySelector('[data-player-card]');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function scrollToNextPlayerCard(playerId) {
  requestAnimationFrame(() => {
    const cards = Array.from(document.querySelectorAll('[data-player-card]'));
    const idx = cards.findIndex(c => c.dataset.playerCard === playerId);
    if (idx >= 0 && idx < cards.length - 1) {
      cards[idx + 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}

function longestAceStreakInRound(round) {
  let streak = 0, best = 0;
  (round.scores || []).forEach(s => {
    if (s === 1) { streak++; if (streak > best) best = streak; }
    else streak = 0;
  });
  return best;
}

const WEATHER_LABELS = { sun: "sonnig", cloud: "bewölkt", rain: "Regen", wind: "windig", cold: "kalt" };

// Per-hole usage details for a given ball (Christian only, from ballsByHole
// history): how often played, how many aces, and the earliest date used there.
function getBallHoleDetails(ballId, opts) {
  const o = opts || {};
  const players = o.playerName ? state.players.filter(p => p.name === o.playerName) : getBallPlayers();
  if (players.length === 0 || !ballId) return { aces: 0, holes: [], perHole: [] };
  const perHoleMap = {}; // hole -> {plays, aces, firstDate}
  let totalAces = 0;
  players.forEach(pl => {
  pl.rounds.forEach(r => {
    if (!r.ballsByHole) return;
    if (o.year && (r.year || (r.date||"").slice(0,4)) !== String(o.year)) return;
    r.ballsByHole.forEach((bId, idx) => {
      if (bId !== ballId) return;
      const hole = idx + 1;
      if (!perHoleMap[hole]) perHoleMap[hole] = { hole, plays: 0, aces: 0, firstDate: r.date || null, rounds: [] };
      perHoleMap[hole].plays++;
      perHoleMap[hole].rounds.push({ roundId: r.id, playerId: pl.id, playerName: pl.name, date: r.date || "", score: (r.scores && r.scores[idx]) || null });
      if (r.date && (!perHoleMap[hole].firstDate || r.date < perHoleMap[hole].firstDate)) perHoleMap[hole].firstDate = r.date;
      if (r.scores && r.scores[idx] === 1) {
        perHoleMap[hole].aces++;
        totalAces++;
      }
    });
  });
  });
  const perHole = Object.values(perHoleMap).sort((a,b) => a.hole - b.hole);
  perHole.forEach(h => h.rounds.sort((a,b) => (b.date||"").localeCompare(a.date||"")));
  const holes = perHole.filter(h => h.aces > 0).map(h => h.hole);
  return { aces: totalAces, holes, perHole };
}
function getBallAceStats(ballId, opts) {
  const d = getBallHoleDetails(ballId, opts);
  return { aces: d.aces, holes: d.holes };
}

// The Ball-DB's season/player filter. Defaults to the current season and the
// first ball-tracking player, so the view opens on the data you're most
// likely to want rather than an unfiltered mix of every season.
function getBallStatsFilter() {
  if (!state.ballStatsFilter) {
    const players = getBallPlayers();
    state.ballStatsFilter = {
      year: String(new Date().getFullYear()),
      playerName: players.some(p => p.name === "Christian") ? "Christian" : (players[0] ? players[0].name : ""),
    };
  }
  return state.ballStatsFilter;
}

// Looks at this player's history on the given hole: which ball(s) they used and
// how often each one scored an ace there. Only recommends a ball once it has
// at least 2 recorded plays on that hole, to avoid a one-off lucky shot. Only
// meaningful for players who record ball-per-hole (see BALL_PLAYERS).
// Returns an array (can be more than one ball, if several had aces here).
function getBallRecommendations(playerId, holeIndex) {
  const player = state.players.find(p => p.id === playerId);
  if (!player) return [];
  const stats = {}; // ballId -> {plays, aces, weatherAtAce: [key,...]}
  player.rounds.forEach(r => {
    const ballId = r.ballsByHole && r.ballsByHole[holeIndex];
    const score = r.scores && r.scores[holeIndex];
    if (!ballId || score == null) return;
    if (!stats[ballId]) stats[ballId] = { plays: 0, aces: 0, weatherAtAce: [] };
    stats[ballId].plays++;
    if (score === 1) {
      stats[ballId].aces++;
      if (r.weather) stats[ballId].weatherAtAce.push(...r.weather);
    }
  });
  // Training attempts count too: many tries at one hole are a better signal
  // than the few aces a ball happens to have in competitive rounds. A ball
  // qualifies on either source.
  const practice = getPracticeRates(player.name, holeIndex);

  const recs = [];
  const candidates = new Set([...Object.keys(stats), ...Object.keys(practice)]);
  candidates.forEach(ballId => {
    const s = stats[ballId] || { plays: 0, aces: 0, weatherAtAce: [] };
    const pr = practice[ballId] || { hits: 0, total: 0 };
    const fromRounds = s.plays >= 2 && s.aces > 0;
    const fromPractice = pr.total >= 5 && pr.hits > 0;
    if (!fromRounds && !fromPractice) return;
    const ball = state.balls.find(b => b.id === ballId);
    if (!ball) return;
    const label = (ball.manufacturer ? ball.manufacturer + " · " : "") + (ball.name || ball.series || "");
    let weatherNote = "";
    if (s.weatherAtAce.length > 0) {
      const counts = {};
      s.weatherAtAce.forEach(k => counts[k] = (counts[k]||0) + 1);
      const topKey = Object.keys(counts).sort((a,b) => counts[b]-counts[a])[0];
      if (WEATHER_LABELS[topKey]) weatherNote = `oft bei ${WEATHER_LABELS[topKey]}`;
    }
    const roundRate = s.plays ? s.aces / s.plays : 0;
    const practiceRate = pr.total ? pr.hits / pr.total : 0;
    // Rank on whichever evidence exists; when both do, weight them by how
    // many observations each rests on, so one lucky round can't outweigh
    // fifty training attempts.
    const rate = (s.plays + pr.total)
      ? (roundRate * s.plays + practiceRate * pr.total) / (s.plays + pr.total)
      : 0;
    recs.push({
      ballId, label, aces: s.aces, plays: s.plays, rate, weatherNote,
      practiceHits: pr.hits, practiceTotal: pr.total,
    });
  });
  recs.sort((a,b) => b.rate - a.rate || b.aces - a.aces);
  return recs;
}

function formatStatsListValue(type, value) {
  if (type === "best") return `${value} / ${PAR_TOTAL}`;

function utf8ToBase64(str) {
  try {
    return btoa(unescape(encodeURIComponent(str)));
  } catch(e) {
    // For very large strings, split and encode in chunks
    const encoder = new TextEncoder();
    const bytes = encoder.encode(str);
    let binary = '';
    const chunkSize = 4096;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }
}
function base64ToUtf8(str) {
  return decodeURIComponent(escape(atob(str.replace(/\n/g, ""))));
}

// Reliably gets a file's sha - uses the 'object' media type so this works even
// for files over 1MB (where the default JSON media type can fail to return it).
const shaCache = {};
async function githubGetSha(cfg, branch, path) {
  if (shaCache[path]) return { ok: true, sha: shaCache[path] };
  try {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${branch}&t=${Date.now()}`;
    const res = await githubApiRequest(url, {
      // NOTE: no Cache-Control header here. GitHub's CORS policy only allows
      // a fixed set of request headers (Authorization, Content-Type, Accept,
      // If-Match, ...) and Cache-Control is NOT among them - sending it makes
      // the browser's preflight fail, which Safari reports as the generic
      // "Load failed" rather than an HTTP status. The ?t=<timestamp> query
      // param above already defeats caching, so the header was never needed.
      headers: { Authorization: `token ${cfg.token}`, Accept: "application/vnd.github.object+json" }
    });
    if (res.status === 404) return { ok: true, sha: null }; // file genuinely doesn't exist yet - fine to create
    if (!res.ok) {
      let reason = `HTTP ${res.status}`;
      try { const j = await res.json(); if (j && j.message) reason = j.message; } catch(e) {}
      return { ok: false, reason };
    }
    const d = await res.json();
    if (d.sha) shaCache[path] = d.sha;
    return { ok: true, sha: d.sha || null };
  } catch(e) {
    return { ok: false, reason: e.message || "Netzwerkfehler bei SHA-Abfrage" };
  }
}

// GitHub's "sha mismatch" conflict message - happens when two saves overlap
// (e.g. saving a round right after adding a ball) and the second write's sha
// reference goes stale because the first write already changed the file.
// GitHub's "sha mismatch" conflict - happens when the file changed since we
// last read its sha (e.g. the other device saved in between, or two saves
// overlapped). GitHub phrases this two different ways depending on the
// endpoint/case, so both are matched here:
//   "... expected <sha> but <file> is at <sha>"
//   "<file> does not match <sha>"
// Missing either wording means no retry and a stale cached sha that blocks
// every subsequent save.
function isShaConflict(reason) {
  if (!reason) return false;
  return (/expected/i.test(reason) && /is at/i.test(reason))
      || /does not match/i.test(reason);
}

async function githubPutFileOnce(cfg, branch, path, contentObj, message) {
  const shaResult = await githubGetSha(cfg, branch, path);
  if (!shaResult.ok) {
    return { ok: false, reason: `SHA-Abfrage fehlgeschlagen: ${shaResult.reason}` };
  }
  const sha = shaResult.sha;
  const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  const body = { message, content: utf8ToBase64(JSON.stringify(contentObj, null, 2)), branch };
  if (sha) body.sha = sha;
  try {
    const res = await githubApiRequest(apiUrl, {
      method: "PUT",
      headers: { Authorization: `token ${cfg.token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      try {
        const d = await res.json();
        if (d && d.content && d.content.sha) shaCache[path] = d.content.sha;
      } catch(e) {}
      return { ok: true };
    }
    let reason = `HTTP ${res.status}`;
    try { const j = await res.json(); if (j && j.message) reason = j.message; } catch(e) {}
    if (isShaConflict(reason)) delete shaCache[path]; // stale cache caused this - force a real fetch next try
    return { ok: false, reason, status: res.status };
  } catch(e) {
    return { ok: false, reason: "Netzwerkfehler" };
  }
}

// Writes a file, automatically retrying once with a fresh sha on conflict.
async function githubPutFile(cfg, branch, path, contentObj, message) {
  let result = await githubPutFileOnce(cfg, branch, path, contentObj, message);
  if (!result.ok && isShaConflict(result.reason)) {
    result = await githubPutFileOnce(cfg, branch, path, contentObj, message);
  }
  return result;
}

// A "Load failed" / "Failed to fetch" style reason means the request never
// really reached GitHub - a genuine transient network blip, not a real
// GitHub-side error. Worth one more full attempt (fresh sha included) after
// a longer pause, since the earlier per-request retries in githubApiRequest
// only cover about 7 seconds total.
function looksLikeNetworkFailure(reason) {
  return !!reason && /load failed|failed to fetch|network ?error|netzwerkfehler/i.test(reason);
}
async function githubPutFileWithRetry(cfg, branch, path, contentObj, message) {
  let result = await githubPutFile(cfg, branch, path, contentObj, message);
  if (!result.ok && looksLikeNetworkFailure(result.reason)) {
    await new Promise(r => setTimeout(r, 3000));
    result = await githubPutFile(cfg, branch, path, contentObj, message);
  }
  return result;
}

// All GitHub writes funnel through this queue so overlapping saves (round
// data + balls, manual save + auto-sync, etc.) run strictly one after
// another instead of racing each other's sha.
let githubSyncChain = Promise.resolve();
function queueGithubWrite(fn) {
  const run = githubSyncChain.then(fn, fn);
  githubSyncChain = run.catch(() => {});
  return run;
}

// Debounced sync for rapid-fire edits. Tapping through ball choices fires one
// change per hole; syncing each one immediately meant hundreds of commits
// piling up in the queue (and a GitHub Pages rebuild for every single one),
// so the sync appeared to run for hours. Everything is saved locally right
// away regardless - this only delays the upload, and collapses a burst of
// changes into a single push.
let pendingSyncTimer = null;
// Sync status for the header indicator: "idle" | "pending" | "syncing" |
// "error". Purely for display; the actual data is always saved locally first.
function setSyncStatus(status, detail) {
  state.syncStatus = status;
  state.syncStatusDetail = detail || null;
  render();
}

// Remembers that this device still has changes GitHub hasn't accepted, so a
// failure isn't silently forgotten when the app is closed. Survives a restart
// and is retried on the next launch.
const SYNC_DIRTY_KEY = "minigolf-sync-dirty";
function markSyncDirty(on) {
  try {
    if (on) localStorage.setItem(SYNC_DIRTY_KEY, "1");
    else localStorage.removeItem(SYNC_DIRTY_KEY);
  } catch(e) {}
}
function isSyncDirty() {
  try { return localStorage.getItem(SYNC_DIRTY_KEY) === "1"; } catch(e) { return false; }
}

function scheduleGithubSync(delayMs = 4000) {
  markSyncDirty(true);
  setSyncStatus("pending");
  if (pendingSyncTimer) clearTimeout(pendingSyncTimer);
  pendingSyncTimer = setTimeout(() => {
    pendingSyncTimer = null;
    githubAutoSync();
  }, delayMs);
}
// If the app is closed or backgrounded with a pending sync, push it now
// rather than losing it.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && pendingSyncTimer) {
    clearTimeout(pendingSyncTimer);
    pendingSyncTimer = null;
    githubAutoSync();
  }
});

async function githubSave() {
  const cfg = loadGithubConfig();
  if (!cfg || !cfg.owner || !cfg.repo || !cfg.token) {
    showToast("GitHub ist nicht eingerichtet – siehe Einstellungen");
    return;
  }
  const path = cfg.path || "minigolf-daten.json";
  const branch = cfg.branch || "main";

  state.syncing = true;
  render();

  try {
    const message = "Minigolf Daten aktualisiert – " + new Date().toLocaleString("de-DE");
    const result = await queueGithubWrite(() => githubPutFileWithRetry(cfg, branch, path, buildExportBundle(), message));

    const { path: ballsPath } = getBallsApiUrl(cfg);
    const ballsMsg = "Bälle-Sync – " + new Date().toLocaleString("de-DE");
    const ballsResult = await queueGithubWrite(() => githubPutFileWithRetry(cfg, branch, ballsPath, { balls: state.balls }, ballsMsg));

    if (result.ok) {
      addSyncEntry("save", "Gespeichert auf GitHub");
    } else if (result.status === 401) {
      showToast("GitHub Token abgelaufen – bitte neu einrichten");
    } else {
      addSyncEntry("save", "⚠️ Sync-Fehler: " + (result.reason || "?").substring(0,60));
      showToast("Fehler: " + (result.reason || "Unbekannt"));
    }

    if (!ballsResult.ok) {
      addSyncEntry("save", "⚠️ Bälle-Sync-Fehler: " + (ballsResult.reason || "").substring(0, 60));
      showToast("Bälle-Sync fehlgeschlagen: " + (ballsResult.reason || "unbekannt"));
    } else if (result.ok) {
      showToast("Auf GitHub gespeichert ✓");
    }

    const manualOk = result.ok && ballsResult.ok;
    markSyncDirty(!manualOk);
    setSyncStatus(manualOk ? "idle" : "error", manualOk ? null : (result.reason || ballsResult.reason || "Unbekannt"));
  } catch (e) {
    showToast("Fehler: " + (e.message || "Unbekannter Fehler beim Speichern"));
  } finally {
    state.syncing = false;
    render();
  }
}

// GitHub's REST API officially supports CORS - including the Authorization
// header - from any origin, so a direct fetch should always be reachable; no
// proxy needed. The corsproxy.io fallback that used to sit here caused three
// separate bugs in earlier testing of this app (a deprecated URL format,
// likely silently stripping the Authorization header down to GitHub's very
// low unauthenticated rate limit, and a probable response-size ceiling) - so
// a failed direct request is retried with a short, increasing delay instead
// of being routed through it.
async function githubApiRequest(url, options = {}, retries = 6) {
  let lastErr;
  for (let i = 0; i < retries; i++) {
    try {
      return await fetch(url, options);
    } catch(e) {
      lastErr = e;
      if (i < retries - 1) await new Promise(r => setTimeout(r, Math.min(500 * (i + 1), 2000)));
    }
  }
  throw lastErr;
}

async function githubAutoSync() {
  const cfg = loadGithubConfig();
  if (!cfg || !cfg.token || !cfg.owner || !cfg.repo) return { ok: false, reason: "Kein GitHub-Zugang konfiguriert" };
  return queueGithubWrite(async () => {
    setSyncStatus("syncing");
    try {
      const branch = cfg.branch || "main";
      const path = cfg.path || "minigolf-daten.json";
      const message = `Auto-Sync ${new Date().toLocaleDateString("de-DE")} ${new Date().toLocaleTimeString("de-DE", {hour:"2-digit",minute:"2-digit"})}`;
      const dataResult = await githubPutFileWithRetry(cfg, branch, path, buildExportBundle(), message);
      if (dataResult.ok) {
        addSyncEntry("save", "Auto-Sync nach Runde");
      } else {
        addSyncEntry("save", "⚠️ Sync-Fehler: " + (dataResult.reason || "?").substring(0,50));
      }

      const { path: ballsPath } = getBallsApiUrl(cfg);
      const ballsMsg = `Bälle-Sync ${new Date().toLocaleDateString("de-DE")}`;
      const ballsResult = await githubPutFileWithRetry(cfg, branch, ballsPath, { balls: state.balls }, ballsMsg);
      if (!ballsResult.ok) {
        addSyncEntry("save", "⚠️ Bälle-Sync-Fehler: " + (ballsResult.reason || "?").substring(0,50));
      }

      const ok = dataResult.ok && ballsResult.ok;
      markSyncDirty(!ok);
      setSyncStatus(ok ? "idle" : "error", ok ? null : (dataResult.reason || ballsResult.reason || "Unbekannt"));
      return { ok, dataResult, ballsResult };
    } catch(e) {
      addSyncEntry("save", "⚠️ Sync-Exception: " + (e.message || "?").substring(0,40));
      markSyncDirty(true);
      setSyncStatus("error", e.message || "Unbekannter Fehler");
      return { ok: false, reason: e.message || "Unbekannter Fehler" };
    }
  });
}


function getBallsApiUrl(cfg) {

async function loadBallsFromGithub() {

    const ballsData = await githubFetchJson(cfg, branch, dir + "minigolf-baelle.json");

async function fetchWithRetry(url, options = {}, retries = 3) {
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(url, options);
      return res;
    } catch (e) {
      if (i === retries - 1) throw e;
      await new Promise(r => setTimeout(r, 1000 * (i + 1)));
    }
  }
}

// Fetches a file's CURRENT content via the GitHub Contents API. Reads used to
// go through raw.githubusercontent.com, but that CDN can keep serving the
// previous version of a file for minutes after a push - even with a
// cache-busting query string. That made cross-device sync look successful
// while quietly handing back stale data (a paused round saved on one device
// simply wasn't in what the other device downloaded). The Contents API always
// reflects the latest commit. Falls back to the raw URL if the API is
// unreachable, so an expired/missing token still degrades to "possibly stale"
// rather than "no sync at all".
async function githubFetchJson(cfg, branch, path) {
  if (cfg.token) {
    try {
      const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${branch}&t=${Date.now()}`;
      // NOTE: no Cache-Control header - GitHub's CORS policy rejects it.
      const res = await githubApiRequest(apiUrl, {
        headers: { Authorization: `token ${cfg.token}`, Accept: "application/vnd.github.raw" }
      });
      if (res.ok) return JSON.parse(await res.text());
    } catch(e) { /* fall through to raw URL */ }
  }
  const rawUrl = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${branch}/${path}?t=${Date.now()}`;
  const res = await fetchWithRetry(rawUrl);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function githubLoad() {
  const cfg = loadGithubConfig();
  if (!cfg || !cfg.owner || !cfg.repo) {
    showToast("GitHub ist nicht eingerichtet – siehe Einstellungen");
    return;
  }
  const path = cfg.path || "minigolf-daten.json";
  const branch = cfg.branch || "main";

  state.syncing = true;

    } catch(e) {

    }
  } catch (e) {
    showToast("Fehler: " + (e.message || "Load failed") + " | URL: " + url.substring(0, 60));
  } finally {
    state.syncing = false;

  }
}

const PAUSED_ROUNDS_KEY = "minigolf-paused-rounds";

function loadPausedRounds() {
  try { return JSON.parse(localStorage.getItem(PAUSED_ROUNDS_KEY) || "[]"); } catch(e) { return []; }
}
function persistPausedRounds(rounds) {
  try { localStorage.setItem(PAUSED_ROUNDS_KEY, JSON.stringify(rounds)); } catch(e) {}
}
function savePausedRound(entry) {
  const rounds = loadPausedRounds();
  const existing = rounds.findIndex(r => r.pauseId === entry.pauseId);
  if (existing >= 0) rounds[existing] = entry;
  else rounds.unshift(entry);
  persistPausedRounds(rounds);
}
function deletePausedRound(pauseId) {
  const rounds = loadPausedRounds().filter(r => r.pauseId !== pauseId);
  persistPausedRounds(rounds);
}

// Paused rounds merge additively (an in-progress round is valuable, so a
// device that hasn't seen one must never delete it). That alone would mean a
// round finished or deleted on one device keeps coming back from the other,
// so retired ids are remembered here and synced alongside the data - any
// merge then drops them, whichever side still carries them.
const RETIRED_PAUSE_IDS_KEY = "minigolf-retired-pause-ids";
function loadRetiredPauseIds() {
  try {
    const raw = localStorage.getItem(RETIRED_PAUSE_IDS_KEY);
    if (raw) { const d = JSON.parse(raw); if (Array.isArray(d)) return d; }
  } catch(e) {}
  return [];
}
function persistRetiredPauseIds(ids) {
  try { localStorage.setItem(RETIRED_PAUSE_IDS_KEY, JSON.stringify(ids.slice(-200))); } catch(e) {}
}
function retirePauseId(pauseId) {
  if (!pauseId) return;
  const ids = loadRetiredPauseIds();
  if (!ids.includes(pauseId)) { ids.push(pauseId); persistRetiredPauseIds(ids); }
}

// Same idea for finished rounds and players: the merge is additive, so a
// round deleted on one device would otherwise be handed straight back by the
// other. Deleted ids are remembered here and synced, and any merge drops
// them no matter which side still carries them.
const DELETED_IDS_KEY = "minigolf-deleted-ids";
function loadDeletedIds() {
  try {
    const raw = localStorage.getItem(DELETED_IDS_KEY);
    if (raw) { const d = JSON.parse(raw); return { rounds: d.rounds || [], players: d.players || [] }; }
  } catch(e) {}
  return { rounds: [], players: [] };
}
function persistDeletedIds(d) {
  try { localStorage.setItem(DELETED_IDS_KEY, JSON.stringify({ rounds: d.rounds.slice(-500), players: d.players.slice(-200) })); } catch(e) {}
}
function markDeleted(type, id) {
  if (!id) return;
  const d = loadDeletedIds();
  if (!d[type].includes(id)) { d[type].push(id); persistDeletedIds(d); }
}

// Resolves a slot id (which may carry the "__slot2" suffix used for the
// double-round tournament player) back to the real player id.
function realPlayerIdForSlot(slotId) {
  return slotId.endsWith(SLOT2_SUFFIX) ? slotId.slice(0, -SLOT2_SUFFIX.length) : slotId;
}
function isSlot2(slotId) {
  return slotId.endsWith(SLOT2_SUFFIX);
}
// Returns {player, label} for a given slot id, where label accounts for the
// "(Runde 2)" suffix on the second slot.
function resolveSlot(slotId) {
  const realId = realPlayerIdForSlot(slotId);
  const player = state.players.find(p => p.id === realId);
  if (!player) return null;
  const label = isSlot2(slotId) ? `${player.name} (Runde 2)` : player.name;
  return { player, label, slotId, isSlot2: isSlot2(slotId) };
}

function getYears(player) {
  if (!player) return [];
  const set = new Set(player.rounds.map(r => r.year || (r.date ? r.date.slice(0,4) : "Unbekannt")));
  return Array.from(set).sort((a,b) => b.localeCompare(a));
}
function getAllYears() {
  const set = new Set();
  state.players.forEach(p => p.rounds.forEach(r => set.add(r.year || (r.date ? r.date.slice(0,4) : "Unbekannt"))));
  set.add(String(new Date().getFullYear()));
  return Array.from(set).filter(y => /^\d{4}$/.test(y)).sort((a,b) => b.localeCompare(a));
}
function getFilteredRounds(player) {
  if (!player) return [];
  if (state.activeYear === "all") return player.rounds;
  return player.rounds.filter(r => (r.year || (r.date ? r.date.slice(0,4) : "Unbekannt")) === state.activeYear);
}

// Builds one entry per played round-group across ALL players (deduped by groupId,
// falling back to the round's own id for solo rounds without a groupId).
// Each entry is the result of getRoundEntries() for one representative player/round.
function getAllRoundGroups() {
  const seen = new Set();
  const groups = [];
  state.players.forEach(player => {
    player.rounds.forEach(round => {
      const key = round.groupId || ("solo:" + round.id);
      if (seen.has(key)) return;
      seen.add(key);
      const entries = getRoundEntries(player.id, round.id);
      // entries[0] after getRoundEntries' sort is the lowest roundNumber (Runde 1) for
      // same-player multi-round groups, which is the more sensible representative.
      const rep = entries[0] ? entries[0].round : round;
      groups.push({ key, date: rep.date, time: rep.time, entries });
    });
  });
  groups.sort((a,b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.time || "") < (a.time || "") ? -1 : 1;
  });
  return groups;
}

function attemptCopy(text) {
  // Try modern Clipboard API first
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => showToast("In Zwischenablage kopiert ✓"))
      .catch(() => legacyCopy(text));
  } else {
    legacyCopy(text);
  }
}

function legacyCopy(text) {
  try {
    const ta = document.getElementById("export-textarea");
    let el = ta;
    if (!el) {
      el = document.createElement("textarea");
      el.value = text;
      el.style.position = "fixed";
      el.style.opacity = "0";
      document.body.appendChild(el);
    }
    el.focus();
    el.select();
    const ok = document.execCommand("copy");
    if (!ta) document.body.removeChild(el);
    if (ok) showToast("In Zwischenablage kopiert ✓");
    else showToast("Kopieren fehlgeschlagen – bitte Text manuell markieren");
  } catch (e) {
    showToast("Kopieren fehlgeschlagen – bitte Text manuell markieren");
  }
}

// Reads the note input for each selected player (current hole) from the DOM
// and stores it into state.entry.notesByPlayer before navigating away.
function captureNotesFromDOM() {
  const e = state.entry;
  if (e.phase !== "play") return;
  const hasTournSlot2 = e.selectedIds.some(id => id.endsWith(SLOT2_SUFFIX));
  const activeIds = hasTournSlot2
    ? (e.tournamentRound === 2
        ? e.selectedIds.filter(id => id.endsWith(SLOT2_SUFFIX))
        : e.selectedIds.filter(id => !id.endsWith(SLOT2_SUFFIX)))
    : e.selectedIds;
  activeIds.forEach(id => {
    const input = document.getElementById("note-" + id);
    if (!input) return;
    const val = input.value.trim();
    if (!e.notesByPlayer[id]) e.notesByPlayer[id] = {};
    if (val) {
      e.notesByPlayer[id][e.currentHole] = val;
    } else {
      delete e.notesByPlayer[id][e.currentHole];
    }
  });
}

  // Finds Christian's rounds from 2026 on where the ball selection is
// incomplete: either a hole has no ball at all, or it points at a ball that
// no longer exists in the database (e.g. it was deleted after the round was
// recorded). Surfaced as a task list on the Dashboard so these can be filled
// in rather than silently staying blank.
const BALL_CHECK_FROM_YEAR = "2026";
function findRoundsWithBallGaps() {
  const ballPlayers = getBallPlayers();
  if (ballPlayers.length === 0) return [];
  const knownBallIds = new Set(state.balls.map(b => b.id));
  // While the ball database is still loading (or genuinely empty) every ball
  // id would look "no longer in the database", making every round flash up as
  // a task. Only run the orphan check once balls are actually available.
  const canCheckOrphans = knownBallIds.size > 0;
  const out = [];
  ballPlayers.forEach(pl => {
  (pl.rounds || []).forEach(r => {
    const year = r.year || (r.date || "").slice(0, 4);
    if (year < BALL_CHECK_FROM_YEAR) return;
    const balls = r.ballsByHole || [];
    const missing = [];
    const orphaned = [];
    for (let i = 0; i < HOLE_COUNT; i++) {
      const id = balls[i];
      if (!id) missing.push(i + 1);
      else if (canCheckOrphans && !knownBallIds.has(id)) orphaned.push(i + 1);
    }
    if (missing.length || orphaned.length) {
      out.push({ round: r, playerId: pl.id, playerName: pl.name, missing, orphaned });
    }
  });
  });
  out.sort((a, b) => (b.round.date || "").localeCompare(a.round.date || ""));
  return out;
}

// Rounds matching the current bulk-replace selection.
function findBulkBallMatches() {
  const r = state.bulkBallReplace || {};
  if (!r.hole || !r.newBall) return [];
  const bpName = state.settingsBallPlayer || (getBallPlayers()[0] ? getBallPlayers()[0].name : "Christian");
  const christian = state.players.find(p => p.name === bpName);
  if (!christian) return [];
  const idx = parseInt(r.hole, 10) - 1;
  const from = r.from || "0000-01-01";
  const to = r.to || "9999-12-31";
  return (christian.rounds || []).filter(round => {
    const d = round.date || "";
    if (d < from || d > to) return false;
    const cur = (round.ballsByHole || [])[idx] || null;
    if (r.oldBall === "__none__") return !cur;
    if (r.oldBall) return cur === r.oldBall;
    return true; // any
  }).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}

// Exact duplicates: same player, same date, identical scores. These can slip
// in when a round is saved twice, and they're easy to miss because a shared
// groupId makes the Runden list show them as a single card while the
// statistics count both.
function findDuplicateRounds() {
  const out = [];
  state.players.forEach(p => {
    const seenIds = new Set();
    const seenContent = {};
    (p.rounds || []).forEach((r, idx) => {
      // Case 1: the very same round listed twice (identical id). This can slip
      // in through a merge and is the more common cause - the Runden view
      // hides it (it keys by id) while the statistics count both entries.
      if (r.id && seenIds.has(r.id)) {
        out.push({ playerId: p.id, playerName: p.name, index: idx, round: r, sameId: true });
        return;
      }
      if (r.id) seenIds.add(r.id);
      // Case 2: two genuinely distinct rounds with identical date and scores.
      const key = (r.date || '') + '|' + JSON.stringify(r.scores || []);
      if (seenContent[key]) {
        out.push({ playerId: p.id, playerName: p.name, index: idx, round: r, sameId: false });
        return;
      }
      seenContent[key] = r;
    });
  });
  return out;
}

// Compares the two ways rounds get counted, to explain a mismatch instead of
// guessing at it. The statistics count each round record; the Runden list
// counts cards, keyed by groupId (or the round id when solo). Anything that
// falls into one but not the other shows up here with the fields that decide
// it, so the real cause is visible.
// Applies a merge: all selected rounds get one shared groupId, which is what
// makes the Runden view show them as a single card.
function doMergeRounds(selected) {
  const newGroupId = uid();
  selected.forEach(({ round }) => { round.groupId = newGroupId; });
  persist();
  state.mergeSelectedIds = [];
  showToast(`${selected.length} Runden zusammengeführt ✓`);
  render();
  githubAutoSync();
}

function findCountMismatch(playerName, year) {
  const p = state.players.find(x => x.name === playerName);
  if (!p) return null;
  const statsRounds = (p.rounds || []).filter(r => (r.year || (r.date||"").slice(0,4)) === year);
  const listRounds  = (p.rounds || []).filter(r => (r.date||"").slice(0,4) === year);
  // Cards this player's rounds map to in the Runden view.
  const cardKeys = new Set(listRounds.map(r => r.groupId || ("solo:" + r.id)));
  // Rounds the statistics count but the list does not (year field vs date).
  const statsIds = new Set(statsRounds.map(r => r.id));
  const listIds = new Set(listRounds.map(r => r.id));
  const onlyInStats = statsRounds.filter(r => !listIds.has(r.id));
  const onlyInList = listRounds.filter(r => !statsIds.has(r.id));
  // Several rounds sharing one card - each extra one explains a difference.
  const byCard = {};
  listRounds.forEach(r => {
    const k = r.groupId || ("solo:" + r.id);
    (byCard[k] = byCard[k] || []).push(r);
  });
  const sharedCards = Object.entries(byCard).filter(([, rs]) => rs.length > 1);
  return {
    statsCount: statsRounds.length,
    cardCount: cardKeys.size,
    onlyInStats, onlyInList, sharedCards,
  };
}

      if (t.missing.length) parts.push(`${t.missing.length} ohne Ball`);
      if (t.orphaned.length) parts.push(`${t.orphaned.length} gelöschter Ball`);
      html += `<button data-action="fix-round-balls" data-player="${esc(t.playerId)}" data-round="${esc(t.round.id)}" style="display:flex; align-items:center; justify-content:space-between; gap:0.6rem; width:100%; text-align:left; background:white; border:1px solid #fcd34d; border-radius:0.6rem; padding:0.55rem 0.75rem; margin-bottom:0.35rem; cursor:pointer;">
        <div>
          <div style="font-weight:600; font-size:0.85rem; color:#1c1917;">${esc(formatDate(t.round.date))}${t.playerName && getBallPlayers().length > 1 ? ` · ${esc(t.playerName)}` : ''}</div>
          <div style="font-size:0.72rem; color:#92400e;">${esc(parts.join(" · "))}${t.missing.length && t.missing.length <= 6 ? ` (Bahn ${t.missing.join(", ")})` : ""}</div>
        </div>
        <span style="color:#92400e; font-size:0.9rem;">›</span>
      </button>`;
    });
    if (tasks.length > 30) {
      html += `<p style="font-size:0.72rem; color:#a8a29e; margin:0.4rem 0 0;">… und ${tasks.length - 30} weitere.</p>`;
    }
  }
  html += `</div>`;
  return html;
}

function renderPausedRoundsCard() {
  const pausedRounds = loadPausedRounds();
  if (pausedRounds.length === 0) return "";
  let html = `<div style="margin-bottom:1rem;">
    <div style="font-size:0.78rem; font-weight:600; color:#92400e; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.4rem;">⏸ Pausierte Runden</div>`;
  pausedRounds.forEach(pr => {
    const playerNames = (pr.selectedIds || []).map(id => {
      const p = state.players.find(p => p.id === id);
      return p ? p.name : null;
    }).filter(Boolean).join(", ");
    const holesDone = pr.currentHole || 0;
    // Running score so far, per player - the most useful thing to see when
    // deciding which paused round to pick back up.
    const standings = (pr.selectedIds || []).map(id => {
      const p = state.players.find(pl => pl.id === id);
      const scores = (pr.scoresByPlayer && pr.scoresByPlayer[id]) || [];
      let total = 0, played = 0;
      scores.forEach(v => { const n = parseInt(v); if (!isNaN(n)) { total += n; played++; } });
      return { name: p ? p.name : "?", total, played };
    }).filter(s => s.played > 0);
    const maxPlayed = standings.reduce((m, s) => Math.max(m, s.played), 0);
    html += `<div style="background:#fffbeb; border:1px solid #fcd34d; border-radius:0.75rem; padding:0.65rem 0.85rem; margin-bottom:0.4rem; display:flex; align-items:center; gap:0.6rem;">
      <div style="flex:1; min-width:0;">
        <div style="font-weight:600; font-size:0.88rem;">${esc(playerNames || "Unbekannt")}</div>
        <div style="font-size:0.75rem; color:#92400e;">${esc(pr.date || "")} · Bahn ${holesDone + 1} von 18${maxPlayed ? ` · ${maxPlayed} gespielt` : ""}</div>
        ${standings.length ? `<div style="font-size:0.75rem; color:#78716c; margin-top:0.15rem;">${standings.map(s => `${esc(s.name)}: <strong style="color:#44403c;">${s.total}</strong>`).join(" · ")}</div>` : ""}
      </div>
      <button class="btn btn-secondary" data-action="resume-round" data-pause-id="${esc(pr.pauseId)}" style="padding:0.35rem 0.65rem; font-size:0.8rem; flex:0; white-space:nowrap;">▶ Fortfahren</button>
      <button data-action="delete-paused-round" data-pause-id="${esc(pr.pauseId)}" style="background:none; border:none; color:#e11d48; font-size:1rem; cursor:pointer; padding:0.25rem;">✕</button>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderRoundsView() {
  const f = state.roundsFilter;
  const allGroups = getAllRoundGroups();

  let html = `<h2 class="section-title" style="margin-bottom:1rem;">${ICONS.flag(18, "#2D6A4F")} Runden</h2>`;

  if (state.players.length === 0) {
    return html + `<div class="card-dashed">Noch keine Spieler angelegt.</div>`;
  }

  // --- Filter card ---
  html += `<div class="card">
    <h3 style="font-size:0.875rem; font-weight:600; color:#44403c; margin:0 0 0.6rem;">🔍 Filter</h3>
    <label class="field-label" style="margin-bottom:0.5rem;">Spieler</label>
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.6rem;">
      ${state.players.map(p => `<button class="chip ${f.playerIds.includes(p.id) ? 'selected' : ''}" data-action="rounds-filter-toggle-player" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join("")}
    </div>`;

  if (f.playerIds.length > 1) {
    html += `<div style="display:flex; gap:0.4rem; margin-bottom:0.75rem;">
      <button class="chip ${f.mode === 'any' ? 'selected' : ''}" data-action="rounds-filter-mode" data-mode="any" style="font-size:0.75rem;">Jeder einzeln</button>
      <button class="chip ${f.mode === 'together' ? 'selected' : ''}" data-action="rounds-filter-mode" data-mode="together" style="font-size:0.75rem;">Nur gemeinsam</button>
    </div>`;
  }

  // Date dropdowns
  const rfYears = [...new Set(allGroups.map(g => g.date?.slice(0,4)))].filter(Boolean).sort().reverse();
  const rfMonths = f.year
    ? [...new Set(allGroups.filter(g => g.date?.startsWith(f.year)).map(g => g.date?.slice(5,7)))].filter(Boolean).sort()
    : [];
  const rfDays = f.year && f.month
    ? [...new Set(allGroups.filter(g => g.date?.startsWith(f.year+"-"+f.month)).map(g => g.date?.slice(8,10)))].filter(Boolean).sort()
    : [];
  const monthNames = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

  html += `<div style="display:flex; gap:0.4rem; margin-bottom:0.6rem;">
    <div style="flex:1;">
      <label class="field-label">Jahr</label>
      <select id="rf-year" style="width:100%;">
        <option value="">–</option>
        ${rfYears.map(y => `<option value="${y}" ${f.year===y?'selected':''}>${y}</option>`).join('')}
      </select>
    </div>
    <div style="flex:1;">
      <label class="field-label">Monat</label>
      <select id="rf-month" style="width:100%;" ${!f.year?'disabled':''}>
        <option value="">–</option>
        ${rfMonths.map(m => `<option value="${m}" ${f.month===m?'selected':''}>${monthNames[parseInt(m)-1]}</option>`).join('')}
      </select>
    </div>
    <div style="flex:1;">
      <label class="field-label">Tag</label>
      <select id="rf-day" style="width:100%;" ${!f.month?'disabled':''}>
        <option value="">–</option>
        ${rfDays.map(d => `<option value="${d}" ${f.day===d?'selected':''}>${parseInt(d)}.</option>`).join('')}
      </select>
    </div>
  </div>
  ${(f.playerIds.length > 0 || f.year) ? `<button class="btn btn-secondary btn-full" style="margin-top:0.25rem;" data-action="rounds-filter-clear">Filter zurücksetzen</button>` : ''}
  </div>`;

  // --- Apply filter ---
  let groups = allGroups;
  if (f.playerIds.length > 0) {
    if (f.mode === "together" && f.playerIds.length > 1) {
      // Only rounds where ALL selected players played together (same groupId / same date+time)
      groups = groups.filter(g => {
        const groupPlayerIds = g.entries.map(e => e.player.id);
        return f.playerIds.every(pid => groupPlayerIds.includes(pid));
      });
    } else {
      // Any: rounds where at least one selected player participated
      groups = groups.filter(g => g.entries.some(e => f.playerIds.includes(e.player.id)));
    }
  }
  if (f.year) groups = groups.filter(g => g.date?.startsWith(f.year));
  if (f.month) groups = groups.filter(g => g.date?.startsWith(f.year+"-"+f.month));
  if (f.day) groups = groups.filter(g => g.date === f.year+"-"+f.month+"-"+f.day);

  html += `<p style="font-size:0.8rem; color:#78716c; margin:0 0 0.75rem;">${groups.length} von ${allGroups.length} Runden</p>`;

  // --- Kopf-an-Kopf-Auswertung ---
  if (f.mode === "together" && f.playerIds.length >= 2 && groups.length > 0) {
    const pids = f.playerIds;
    const pNames = {};
    state.players.forEach(p => { if (pids.includes(p.id)) pNames[p.id] = p.name; });

    // Count wins, draws, avg score per player
    const wins = {}, totalScore = {}, roundCount = {};
    pids.forEach(id => { wins[id] = 0; totalScore[id] = 0; roundCount[id] = 0; });
    let draws = 0;

    groups.forEach(g => {
      // Only count groups where ALL selected players are present
      const present = pids.filter(pid => g.entries.some(e => e.player.id === pid));
      if (present.length < pids.length) return;

      const scores = {};
      pids.forEach(pid => {
        const entry = g.entries.find(e => e.player.id === pid);
        if (entry) {
          const total = entry.round.scores.reduce((a,b) => a+(b||0), 0);
          scores[pid] = total;
          totalScore[pid] += total;
          roundCount[pid]++;
        }
      });

      const minScore = Math.min(...Object.values(scores));
      const winners = pids.filter(pid => scores[pid] === minScore);
      if (winners.length > 1) {
        draws++;
      } else {
        wins[winners[0]]++;
      }
    });

    // Sort by wins desc
    const sorted = [...pids].sort((a,b) => wins[b] - wins[a]);
    const totalRounds = roundCount[pids[0]] || 0;

    html += `<div class="card" style="margin-bottom:1rem; background:linear-gradient(135deg,#f0fdf4,#ecfdf5); border:1px solid #a7f3d0;">
      <h3 style="font-size:0.85rem; font-weight:700; color:#047857; margin:0 0 0.75rem;">⚔️ Kopf-an-Kopf · ${totalRounds} gemeinsame Runden</h3>`;

    // Bilanz-Zeile z.B. "Chris 8 – 2 – 3 Thomas"
    if (pids.length === 2) {
      const [a, b] = sorted;
      html += `<div style="text-align:center; font-size:1.05rem; font-weight:700; color:#1a4a35; margin-bottom:0.75rem; letter-spacing:0.02em;">
        ${esc(pNames[a])} <span style="color:#16a34a;">${wins[a]}</span>
        <span style="color:#a8a29e; font-weight:400; margin:0 0.3rem;">–</span>
        <span style="color:#a8a29e;">${draws}</span>
        <span style="color:#a8a29e; font-weight:400; margin:0 0.3rem;">–</span>
        <span style="color:#dc2626;">${wins[b]}</span> ${esc(pNames[b])}
      </div>`;
    }

    // Tabelle
    html += `<div style="display:flex; flex-direction:column; gap:0.4rem;">`;
    sorted.forEach((pid, idx) => {
      const avg = roundCount[pid] > 0 ? (totalScore[pid] / roundCount[pid]).toFixed(1) : "–";
      const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : "🥉";
      const winPct = totalRounds > 0 ? Math.round(wins[pid] / totalRounds * 100) : 0;
      const isActive = state.roundsWinFilter === pid;
      html += `<button data-action="toggle-win-filter" data-pid="${esc(pid)}" style="display:flex; align-items:center; gap:0.6rem; padding:0.4rem 0.5rem; background:${isActive ? '#dcfce7' : 'white'}; border-radius:0.5rem; border:${isActive ? '2px solid #16a34a' : '1px solid #f0f0f0'}; cursor:pointer; width:100%; text-align:left;">
        <span style="font-size:1.1rem;">${medal}</span>
        <span style="flex:1; font-weight:600; font-size:0.9rem;">${esc(pNames[pid])}</span>
        <span style="font-size:0.8rem; color:#16a34a; font-weight:700;">${wins[pid]}×🏆</span>
        <span style="font-size:0.75rem; color:#a8a29e;">${winPct}%</span>
        <span style="font-size:0.75rem; color:#78716c; min-width:3.5rem; text-align:right;">Ø ${avg}</span>
        <span style="font-size:0.7rem; color:${isActive ? '#16a34a' : '#d6d3d1'};">${isActive ? '▲' : '▼'}</span>
      </button>`;
    });

    if (draws > 0) {
      html += `<div style="text-align:center; font-size:0.78rem; color:#a8a29e; margin-top:0.25rem;">🤝 ${draws}× Unentschieden</div>`;
    }

    if (state.roundsWinFilter) {
      html += `<div style="font-size:0.75rem; color:#047857; margin-top:0.4rem; text-align:center;">
        🏆 Nur Siege von ${esc(pNames[state.roundsWinFilter])} · <button data-action="toggle-win-filter" data-pid="" style="background:none;border:none;color:#a8a29e;font-size:0.75rem;text-decoration:underline;cursor:pointer;">alle zeigen</button>
      </div>`;
    }

    html += `</div></div>`;

    // Apply win filter to groups
    if (state.roundsWinFilter) {
      const wfPid = state.roundsWinFilter;
      groups = groups.filter(g => {
        const present = pids.filter(pid => g.entries.some(e => e.player.id === pid));
        if (present.length < pids.length) return false;
        const scores = {};
        pids.forEach(pid => {
          const entry = g.entries.find(e => e.player.id === pid);
          if (entry) scores[pid] = entry.round.scores.reduce((a,b) => a+(b||0), 0);
        });
        const minScore = Math.min(...Object.values(scores));
        const winners = pids.filter(pid => scores[pid] === minScore);
        return winners.length === 1 && winners[0] === wfPid;
      });
    }
  }

  if (groups.length === 0) {
    html += `<div class="card-dashed">Keine Runden für diese Auswahl. Tippe oben auf "Eintragen", um eine neue Runde zu erfassen.</div>`;
    return html;
  }

  groups.forEach(g => {
    const isTournamentGroup = g.entries.length > 1 && g.entries.every(en => en.player.id === g.entries[0].player.id);

    // Determine winner (lowest total) when more than one DISTINCT player participated.
    // (Not used for the tournament-with-self case, where each row is the same player.)
    let winner = null;
    if (g.entries.length > 1 && !isTournamentGroup) {
      winner = g.entries.reduce((best, cur) => {
        const curTotal = cur.round.scores.reduce((a,b)=>a+b,0);
        const bestTotal = best.round.scores.reduce((a,b)=>a+b,0);
        return curTotal < bestTotal ? cur : best;
      });
    }

    html += `<div class="round-card">
      <div class="round-top">
        <div>
          <div class="round-date">${formatDate(g.date)}${g.time ? ', ' + g.time : ''} ${g.entries[0].round.weather ? weatherIconsForRound(g.entries[0].round.weather) : ''}${g.entries[0].round.temperature ? ' ' + g.entries[0].round.temperature + '°C' : ''}${g.entries[0].round.windSpeed ? ', ' + g.entries[0].round.windSpeed + ' km/h' : ''}${g.entries[0].round.precipProbability ? ', ' + g.entries[0].round.precipProbability + '% Regen' : ''}</div>
          <div class="round-sub">${isTournamentGroup ? esc(g.entries[0].player.name) : g.entries.map(e => esc(e.player.name)).join(", ")}</div>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <button class="icon-btn icon-btn-info" data-action="show-round-detail" data-player="${esc(g.entries[0].player.id)}" data-round="${esc(g.entries[0].round.id)}" title="Details">${ICONS.info(18)}</button>
        </div>
      </div>`;

    g.entries.forEach(({ player, round }, idx) => {
      const total = round.scores.reduce((a,b)=>a+b,0);
      const diff = total - PAR_TOTAL;
      const isWinner = winner && player.id === winner.player.id && round.id === winner.round.id;
      const rowLabel = isTournamentGroup ? `Runde ${round.roundNumber || (idx+1)}` : player.name;
      html += `<div style="display:flex; align-items:center; justify-content:space-between; padding:0.4rem 1rem; border-top:1px solid #f5f5f4;">
        <span style="font-weight:${isWinner ? '600' : '500'};">${isWinner ? '🏆 ' : ''}${esc(rowLabel)}</span>
        <span class="font-mono" style="font-weight:600;">${total} <span style="font-weight:400; color:#a8a29e; font-size:0.8rem;">(${diff === 0 ? 'Par' : diff > 0 ? '+'+diff : diff})</span></span>
      </div>`;
    });

    if (isTournamentGroup) {
      const groupId = g.entries[0].round.groupId || g.key;
      html += renderTournamentBlock(groupId);
    }

    html += `<div style="padding:0.75rem 1rem; display:flex; justify-content:flex-end;">
        <button class="icon-btn icon-btn-danger" data-action="delete-round" data-id="${esc(g.entries[0].round.id)}" data-player="${esc(g.entries[0].player.id)}" title="Löschen">${ICONS.trash(16)}</button>
      </div>
    </div>`;
  });

  return html;
}

// ============================================================
// Entry view (live round flow)
// ============================================================
function renderEntryView() {
  const e = state.entry;
  // Each entry represents one "slot" being scored: {id, name, player} - id is the
  // scoresByPlayer/notesByPlayer/starsByPlayer key (may be a "__slot2" variant for
  // the double-round tournament player), name is the display label, player is the
  // real underlying player record.
  const selectedPlayers = e.selectedIds.map(slotId => {
    const resolved = resolveSlot(slotId);
    if (!resolved) return null;
    return { id: slotId, name: resolved.label, player: resolved.player };
  }).filter(Boolean);

  if (e.phase === "setup") {
    let html = `<h2 class="section-title">${ICONS.flag(18, "#2D6A4F")} Neue Runde starten</h2>`;

    // --- Neue Saison: Ball-Erinnerung ---
    {
      const curYear = (e.date || todayISO()).slice(0,4);
      const missingFor = getBallPlayers().filter(pl => {
        const picks = state.holeDefaultBalls[holeDefaultKey(pl.name, curYear)];
        return !picks || !picks.some(Boolean);
      }).map(pl => pl.name);
      const hasSeasonPicks = missingFor.length === 0;
      if (!hasSeasonPicks && !state.holeBallPromptSeen.includes(curYear) && curYear >= "2026") {
        html += `<div class="card" style="background:#fefce8; border:1px solid #fde68a; margin-bottom:1rem; display:flex; align-items:center; justify-content:space-between; gap:0.75rem; flex-wrap:wrap;">
          <div style="font-size:0.85rem; color:#78350f;">🎱 Neue Saison ${esc(curYear)}: Standard-Bälle pro Bahn für ${esc(missingFor.join(", "))} noch nicht festgelegt.</div>
          <div style="display:flex; gap:0.4rem; flex:0 0 auto;">
            <button class="btn btn-secondary" data-action="dismiss-season-ball-prompt" data-year="${esc(curYear)}" style="padding:0.35rem 0.6rem; font-size:0.78rem;">Später</button>
            <button class="btn btn-primary" data-action="goto-season-ball-settings" data-year="${esc(curYear)}" style="padding:0.35rem 0.6rem; font-size:0.78rem;">Jetzt festlegen</button>
          </div>
        </div>`;
      }
    }

    // --- Pausierte Runden ---
    html += renderPausedRoundsCard();

    // --- Datum & Uhrzeit ---
    html += `<div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
      <div style="flex:1;">
        <label class="field-label">Datum</label>
        <input type="date" id="entry-date" value="${esc(e.date)}" />
      </div>
      ${e.date === todayISO() ? `<div style="width:7rem;">
        <label class="field-label">Uhrzeit</label>
        <input type="time" id="entry-time" value="${esc(e.time || nowTimeHHMM())}" />
      </div>` : ''}
    </div>`;

    // --- Wetter Symbole ---
    html += `<div style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.6rem;">
      ${WEATHER_OPTIONS.map(w => `<button class="chip ${e.weatherKeys.includes(w.key) ? 'selected' : ''}" data-action="toggle-weather" data-key="${w.key}" style="font-size:1.1rem;" title="${w.label}">${w.icon}</button>`).join("")}
      ${state.weatherLocation && e.date === todayISO()
        ? `<button class="chip" data-action="fetch-weather-auto" ${state.weatherLookupStatus === 'loading' ? 'disabled' : ''} style="font-size:0.78rem;">
            ${state.weatherLookupStatus === 'loading' ? '⏳' : '📍 Wetter'}
          </button>`
        : ''}
    </div>`;

    // --- Temperatur / Wind / Regen in einer Zeile ---
    html += `<div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
      <div style="flex:1; display:flex; align-items:center; gap:0.3rem;">
        <span style="font-size:1rem;">🌡️</span>
        <input type="text" inputMode="numeric" id="entry-temperature" value="${esc(e.temperature || '')}" placeholder="°C" style="width:100%; min-width:0;" />
      </div>
      <div style="flex:1; display:flex; align-items:center; gap:0.3rem;">
        <span style="font-size:1rem;">💨</span>
        <input type="text" inputMode="numeric" id="entry-windspeed" value="${esc(e.windSpeed || '')}" placeholder="km/h" style="width:100%; min-width:0;" />
      </div>
      <div style="flex:1; display:flex; align-items:center; gap:0.3rem;">
        <span style="font-size:1rem;">🌧️</span>
        <input type="text" inputMode="numeric" id="entry-precip" value="${esc(e.precipProbability || '')}" placeholder="%" style="width:100%; min-width:0;" />
      </div>
    </div>`;

    // --- Wer spielt? Aufklapp ---
    const showPlayerPicker = state.entry.showPlayerPicker !== false;
    const selCount = e.selectedIds.length;
    const selNames = selCount > 0
      ? e.selectedIds.map(id => state.players.find(p => p.id === id)?.name || "").filter(Boolean).join(", ")
      : "Niemand ausgewählt";

    html += `<div class="collapsible-card" style="margin-bottom:1rem;">
      <button class="collapsible-head" data-action="toggle-player-picker" style="justify-content:space-between;">
        <span style="font-weight:600; font-size:0.95rem;">👥 Wer spielt?${selCount > 0 ? ` <span style="color:#16a34a; font-size:0.8rem;">(${selCount})</span>` : ''}</span>
        <span style="font-size:0.78rem; color:#78716c; flex:1; margin:0 0.5rem; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(selNames)}</span>
        <span class="collapsible-arrow ${showPlayerPicker ? '' : 'collapsed'}">${ICONS.chevron(16)}</span>
      </button>`;

    if (showPlayerPicker) {
      html += `<div class="collapsible-body" style="padding-top:0.5rem;">
        <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.75rem;">`;

      state.players.forEach(p => {
        const sel = e.selectedIds.includes(p.id);
        const isDouble = p.name === DOUBLE_ROUND_PLAYER_NAME;
        html += `<button class="chip ${sel ? 'selected' : ''}" data-action="toggle-entry-player" data-id="${esc(p.id)}">${esc(p.name)}${isDouble ? ' (2R)' : ''}</button>`;
      });

      html += `</div>`;

      // Speichern für wen
      if (e.selectedIds.length > 0) {
        html += `<div style="border-top:1px solid #f0ede6; padding-top:0.6rem; margin-bottom:0.6rem;">
          <p style="font-size:0.72rem; color:#a8a29e; margin:0 0 0.4rem;">Ergebnis speichern für:</p>
          <div style="display:flex; flex-wrap:wrap; gap:0.4rem;">`;
        e.selectedIds.forEach(id => {
          const p = state.players.find(pl => pl.id === id);
          if (!p) return;
          const willSave = e.saveIds.includes(id);
          html += `<button class="save-chip ${willSave ? 'will-save' : ''}" data-action="toggle-save" data-id="${esc(id)}">
            <span class="box">${willSave ? '✓' : ''}</span>${esc(p.name)}
          </button>`;
        });
        html += `</div></div>`;
      }

      // Neuer Spieler inline
      html += `<div style="display:flex; gap:0.5rem; align-items:center; border-top:1px solid #f0ede6; padding-top:0.6rem;">
        <span style="font-size:0.85rem; color:#78716c; white-space:nowrap;">+ Neu:</span>
        <input type="text" id="new-entry-player-name" placeholder="Name eingeben…" style="flex:1; min-width:0;" />
        <button class="btn btn-secondary" data-action="add-entry-player" style="padding:0.4rem 0.7rem; font-size:0.82rem; white-space:nowrap; flex:0;">${ICONS.plus(14)} Hinzufügen</button>
      </div>`;

      html += `</div>`;
    }

    html += `</div>`;

    html += `<button class="btn btn-primary btn-full" data-action="start-round" style="display:flex; align-items:center; justify-content:center; gap:0.5rem;" ${e.selectedIds.length === 0 ? 'disabled' : ''}>${ICONS.flag(18)} Runde starten</button>`;
    return html;
  }

  if (e.phase === "play") {
    const par = PARS[e.currentHole];
    // For tournament (double-round) play, only show the slots for the current round
    const hasTournamentPlayer = e.selectedIds.some(id => {
      const resolved = resolveSlot(id);
      return resolved && resolved.player.name === DOUBLE_ROUND_PLAYER_NAME;
    });
    const isTournamentMode = hasTournamentPlayer && e.selectedIds.some(id => id.endsWith(SLOT2_SUFFIX));
    const activeSlotIds = isTournamentMode
      ? e.selectedIds.filter(id => e.tournamentRound === 2 ? id.endsWith(SLOT2_SUFFIX) : !id.endsWith(SLOT2_SUFFIX))
      : e.selectedIds;
    const activeSelectedPlayers = activeSlotIds.map(slotId => {
      const resolved = resolveSlot(slotId);
      if (!resolved) return null;
      return { id: slotId, name: resolved.label, player: resolved.player };
    }).filter(Boolean);
    const allFilledForHole = activeSlotIds.every(id => e.scoresByPlayer[id]?.[e.currentHole] !== "");
    const allHolesFilledForAllPlayers = activeSlotIds.every(id => (e.scoresByPlayer[id] || []).every(s => s !== "" && s !== undefined && s !== null));
    const missingHoleNumbers = [];
    for (let hi = 0; hi < 18; hi++) {
      const missing = activeSlotIds.some(id => { const v = (e.scoresByPlayer[id] || [])[hi]; return v === "" || v === undefined || v === null; });
      if (missing) missingHoleNumbers.push(hi + 1);
    }
    const isLastHole = e.currentHole === 17;
    const isRound1Done = isTournamentMode && isLastHole && e.tournamentRound === 1 && allFilledForHole;

    let html = `<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.25rem;">
      <h2 class="section-title" style="margin:0;">${ICONS.flag(18, "#2D6A4F")} ${formatDate(e.date)}${isTournamentMode ? ` · Runde ${e.tournamentRound}` : ''}</h2>
    </div>

    <div class="hole-indicator">
      <button data-action="prev-hole" ${e.currentHole === 0 ? 'disabled' : ''}>‹</button>
      <div class="center">
        <div class="label">Bahn</div>
        <div class="number font-mono">${e.currentHole + 1}</div>
        <div class="par">Par ${par}</div>
      </div>
      <button data-action="next-hole-nav">›</button>
    </div>

    <div class="progress-dots">`;
    HOLES.forEach((h, idx) => {
      const done = activeSlotIds.every(id => e.scoresByPlayer[id]?.[idx] !== "");
      let cls = "dot";
      if (idx === e.currentHole) cls += " current";
      else if (done) cls += " done";
      html += `<button class="${cls}" data-action="jump-hole" data-idx="${idx}">${h}</button>`;
    });
    html += `</div>`;

    activeSelectedPlayers.forEach(p => {
      const scores = e.scoresByPlayer[p.id] || Array(18).fill("");
      const current = scores[e.currentHole];
      // Sum ALL entered scores, not just the holes up to the current one.
      // When holes are played out of order (skip ahead, come back later), the
      // ones played later were being left out of the running total.
      const runningTotal = scores.reduce((s,v)=>s+(parseInt(v)||0),0);
      const displayName = isTournamentMode ? (e.tournamentRound === 1 ? 'Runde 1' : 'Runde 2') : p.name;
      const canRemove = activeSelectedPlayers.length > 1 && !isTournamentMode;
      html += `<div class="card" data-player-card="${esc(p.id)}">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
          <h3 class="font-display" style="margin:0; font-size:1rem;">${esc(displayName)}</h3>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <div class="font-mono" style="font-size:0.875rem; color:#a8a29e;">Gesamt ${runningTotal}</div>
            ${canRemove ? `<button data-action="remove-player-from-round" data-id="${esc(p.id)}" style="background:none;border:none;color:#e11d48;font-size:0.85rem;cursor:pointer;padding:0.1rem 0.3rem;" title="Spieler aus Runde entfernen">✕</button>` : ''}
          </div>
        </div>`;
      const realPlayerId = p.player ? p.player.id : p.id;
      const realPlayerName = p.player ? p.player.name : p.name;
      if (isBallPlayer(realPlayerName)) {
        const usedBallId = e.ballsByHole && e.ballsByHole[e.currentHole];
        const seasonYear = (e.date || "").slice(0,4);
        const seasonBallId = (state.holeDefaultBalls[holeDefaultKey(realPlayerName, seasonYear)] || [])[e.currentHole] || null;
        const effectiveBallId = usedBallId || seasonBallId;
        const effectiveBall = effectiveBallId ? state.balls.find(b => b.id === effectiveBallId) : null;
        if (!e.showBallPicker) {
          // Collapsed view still surfaces the recommendation - hiding it behind
          // "ändern" meant the season default silently overrode the very hint
          // it should be checked against.
          const collapsedRecs = getBallRecommendations(realPlayerId, e.currentHole);
          const recsOpen = e.showRecs;
          html += `<div style="margin-bottom:0.6rem;">
            <div style="display:flex; align-items:center; justify-content:space-between; font-size:0.8rem; color:#57534e;">
              <span>Ball: ${effectiveBall ? esc((effectiveBall.manufacturer ? effectiveBall.manufacturer + ' · ' : '') + (effectiveBall.name || effectiveBall.series || effectiveBall.id)) : '– kein Standard gesetzt –'}</span>
              <button data-action="toggle-entry-ball-picker" style="background:none; border:none; color:#2D6A4F; font-size:0.78rem; text-decoration:underline; cursor:pointer; padding:0.2rem;">ändern</button>
            </div>
            ${collapsedRecs.length > 0 ? `
              <button data-action="toggle-entry-recs" style="display:flex; align-items:center; gap:0.3rem; background:none; border:none; padding:0.25rem 0; margin-top:0.15rem; font-size:0.75rem; color:#15803d; cursor:pointer;">
                <span>🎯 ${collapsedRecs.length} Empfehlung${collapsedRecs.length === 1 ? '' : 'en'} für Bahn ${e.currentHole + 1}</span>
                <span style="color:#a8a29e;">${recsOpen ? '▾' : '▸'}</span>
              </button>
              ${recsOpen ? collapsedRecs.map(rec => {
                const active = effectiveBallId === rec.ballId;
                return `<button data-action="set-hole-ball" data-ball="${esc(rec.ballId)}" style="display:flex; align-items:center; gap:0.4rem; width:100%; text-align:left; background:${active ? '#dcfce7' : '#f0fdf4'}; border:1px solid ${active ? '#15803d' : '#86efac'}; border-radius:0.5rem; padding:0.4rem 0.6rem; margin-bottom:0.3rem; font-size:0.78rem; color:#15803d; cursor:pointer;">
                  <strong>${esc(rec.label)}</strong> – ${rec.plays ? `${rec.aces} Asse / ${rec.plays} Runden` : ''}${rec.plays && rec.practiceTotal ? ' · ' : ''}${rec.practiceTotal ? `Training ${rec.practiceHits}/${rec.practiceTotal}` : ''}${rec.weatherNote ? ` (${esc(rec.weatherNote)})` : ''}${active ? ' ✓' : ''}
                </button>`;
              }).join('') : ''}
            ` : ''}
          </div>`;
        } else {
        const recs = getBallRecommendations(realPlayerId, e.currentHole);
        if (recs.length > 0) {
          const usedBallId0 = e.ballsByHole && e.ballsByHole[e.currentHole];
          html += `<div style="margin-bottom:0.5rem;">`;
          recs.forEach(rec => {
            const active = usedBallId0 === rec.ballId;
            html += `<button data-action="set-hole-ball" data-ball="${esc(rec.ballId)}" style="display:flex; align-items:center; gap:0.4rem; width:100%; text-align:left; background:${active ? '#dcfce7' : '#f0fdf4'}; border:1px solid ${active ? '#15803d' : '#86efac'}; border-radius:0.5rem; padding:0.4rem 0.6rem; margin-bottom:0.35rem; font-size:0.8rem; color:#15803d; cursor:pointer;">
              🎯 <strong>${esc(rec.label)}</strong> – ${rec.plays ? `${rec.aces} Asse / ${rec.plays} Runden` : ''}${rec.plays && rec.practiceTotal ? ' · ' : ''}${rec.practiceTotal ? `Training ${rec.practiceHits}/${rec.practiceTotal}` : ''}${rec.weatherNote ? ` (${esc(rec.weatherNote)})` : ''}${active ? ' ✓' : ''}
            </button>`;
          });
          html += `</div>`;
        }
        const usedBall = usedBallId ? state.balls.find(b => b.id === usedBallId) : null;
        html += `<div style="margin-bottom:0.6rem;">
          <div style="font-size:0.78rem; color:#78716c; margin-bottom:0.35rem;">Welchen Ball gespielt? (optional)</div>
          <div style="display:flex; gap:0.5rem; overflow-x:auto; padding-bottom:0.25rem;">
            <button data-action="set-hole-ball" data-ball="" style="flex:0 0 auto; width:3rem; height:3rem; border-radius:50%; border:2px solid ${!usedBallId ? '#2D6A4F' : '#e7e5e4'}; background:#f5f5f4; display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:#a8a29e; cursor:pointer; padding:0;">Kein</button>
            ${state.balls.map(b => {
              const label = (b.manufacturer ? b.manufacturer + " · " : "") + (b.name || b.series || b.id);
              const selected = usedBallId === b.id;
              const inner = b.photo
                ? `<img src="${b.photo}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:50%;" />`
                : `<span style="font-size:1.3rem;">⚪</span>`;
              return `<button data-action="set-hole-ball" data-ball="${esc(b.id)}" title="${esc(label)}" style="flex:0 0 auto; width:3rem; height:3rem; border-radius:50%; border:2px solid ${selected ? '#2D6A4F' : '#e7e5e4'}; overflow:hidden; padding:0; cursor:pointer; background:white; display:flex; align-items:center; justify-content:center;">${inner}</button>`;
            }).join('')}
          </div>
          ${usedBall ? `<div style="font-size:0.8rem; color:#2D6A4F; font-weight:600; margin-top:0.35rem;">✓ ${esc((usedBall.manufacturer ? usedBall.manufacturer + " · " : "") + (usedBall.name || usedBall.series || usedBall.id))}</div>` : ''}
          <button data-action="toggle-entry-ball-picker" style="background:none; border:none; color:#78716c; font-size:0.75rem; text-decoration:underline; cursor:pointer; padding:0.35rem 0 0;">einklappen</button>
        </div>`;
        }
      }
      html += `<div class="score-grid">`;
      [1,2,3,4,5,6,7].forEach(n => {
        let cls = "score-btn";
        const selected = String(current) === String(n);
        if (selected) {
          if (n === 1) cls += " sel-1";
          else {
            const diff = n - par;
            if (diff <= -1) cls += " sel-good";
            else if (diff === 0) cls += " sel-par";
            else cls += " sel-bad";
          }
          cls += " ring";
        }
        let txtCls = "";
        if (current !== "") {
          if (n === 1) txtCls = "txt-ace";
          else { const d = n - par; txtCls = d <= -1 ? "txt-good" : d === 0 ? "txt-par" : "txt-bad"; }
        }
        html += `<button class="${cls} font-mono ${txtCls}" data-action="set-score" data-player="${esc(p.id)}" data-val="${n}">${n}${n===1 ? ' '+ICONS.trophy(11, '#f59e0b') : ''}</button>`;
      });
      const starred = !!(e.starsByPlayer[p.id] && e.starsByPlayer[p.id][e.currentHole]);
      const starEligible = current !== "" && parseInt(current) >= 2 && parseInt(current) <= 6;
      html += `</div>
        <button class="star-toggle ${starred ? 'active' : ''}" data-action="toggle-star" data-player="${esc(p.id)}" ${!starEligible ? 'disabled' : ''} title="Vom Abschlag mit dem ${current}. Schlag eingelocht">
          ${ICONS.star(15)} <span>${starred ? 'Vom Abschlag eingelocht ✓' : 'Vom Abschlag eingelocht?'}</span>
        </button>`;
      const noteVal = (e.notesByPlayer[p.id] && e.notesByPlayer[p.id][e.currentHole]) || "";
      html += `<input type="text" class="note-input" id="note-${esc(p.id)}" value="${esc(noteVal)}" placeholder="Notiz zu Bahn ${e.currentHole+1} (optional)" />
      </div>`;
    });

    // A "gap" means an open hole sits below the highest hole already fully filled -
    // i.e. genuinely skipped, not just "not reached yet" in normal sequential play.
    let maxFilledIndex = -1;
    for (let hi = 0; hi < 18; hi++) {
      const filled = activeSlotIds.every(id => { const v = (e.scoresByPlayer[id] || [])[hi]; return v !== "" && v !== undefined && v !== null; });
      if (filled) maxFilledIndex = hi;
    }
    const hasGap = missingHoleNumbers.some(h => (h - 1) < maxFilledIndex);
    // Finishing shouldn't depend on standing on hole 18. Once every hole is
    // filled in - which can happen on hole 5 if the rest was played earlier -
    // the round is complete and the button should say so.
    const isFinishStep = (isLastHole || allHolesFilledForAllPlayers)
      && (!isTournamentMode || e.tournamentRound === 2);
    if (allFilledForHole && hasGap && !isFinishStep) {
      html += `<div style="background:#fffbeb; border:1px solid #fbbf24; border-radius:0.6rem; padding:0.6rem 0.75rem; margin-bottom:0.6rem;">
        <label class="field-label" style="margin-bottom:0.4rem;">Es gibt noch offene Bahnen (${missingHoleNumbers.join(', ')}) – wohin als Nächstes?</label>

    html += `<div class="btn-row">`;
    if (e.currentHole > 0) {

      html += `<button class="btn btn-primary" data-action="start-tournament-round2" style="background:var(--green-dark);">🏌️ 2. Runde starten</button>`;
    } else {
      // Find the next OPEN hole (skipping ones already filled, e.g. from an earlier jump), not just currentHole+1
      let nextOpenHoleIndex = null;
      for (let hi = e.currentHole + 1; hi < 18; hi++) {
        const filled = activeSlotIds.every(id => { const v = (e.scoresByPlayer[id] || [])[hi]; return v !== "" && v !== undefined && v !== null; });
        if (!filled) { nextOpenHoleIndex = hi; break; }
      }
      if (nextOpenHoleIndex === null) {
        for (let hi = 0; hi < e.currentHole; hi++) {
          const filled = activeSlotIds.every(id => { const v = (e.scoresByPlayer[id] || [])[hi]; return v !== "" && v !== undefined && v !== null; });
          if (!filled) { nextOpenHoleIndex = hi; break; }
        }

      // On the last hole with gaps still open, sending the user to the lowest
      // missing hole is far more useful than a disabled "Runde beenden" that
      // gives them nowhere to go.
      const finishBlocked = isFinishStep && !allHolesFilledForAllPlayers && nextOpenHoleIndex !== null;

      const nextLabel = nextOpenHoleIndex !== null ? `Weiter zu Bahn ${nextOpenHoleIndex + 1}` : `Weiter zu Bahn ${Math.min(e.currentHole + 2, 18)}`;

          <button class="btn btn-primary btn-full" data-action="share-ace-streak" style="margin-top:0.85rem;">📤 Bild teilen</button>

          ${r.errors > 0 ? `<span style="display:flex; align-items:center; gap:0.25rem; color:#dc2626;">⚠️ ${r.errors} ${r.errors===1?'Fehler':'Fehler'}</span>` : ''}
